# ════════════════════════════════════════════════════════════════════════════
# FULKRO — docker-compose.prod.yml · PRODUCCIÓN (Hetzner)
# ════════════════════════════════════════════════════════════════════════════
# Stack production-grade completo. NO usar para dev (usar docker-compose.yml).
#
#   env_file: .env.prod   (NUNCA .env · .env es dev · .env.prod va gitignored)
#
# Orden de provisión (servicio `provision` lo automatiza · ver
# infra/docker/provision-entrypoint.sh + docs/deploy/HETZNER_DEPLOY_RUNBOOK.md):
#   postgres healthy → provision (init-roles + alembic upgrade head + seed +
#   REVOKE audit_log) completa → backend/celery arrancan.
#
# Validación local (throwaway · NO toca dev ni la BD live):
#   docker compose -f docker-compose.prod.yml --env-file .env.prod config
#   docker compose -f docker-compose.prod.yml build
#
# FRONTERA HONESTA (Hetzner-only · NO validable aquí):
#   - TLS real (Let's Encrypt) requiere dominio público + puertos 80/443 +
#     DNS apuntando al server → solo en Hetzner (caddy auto_https).
#   - ClamAV freshclam DB (~200MB) + cold-start ~2 min · MinIO WORM real
#     (Object Lock 7y) · fastembed cargando el modelo de embeddings.
#   - El smoke completo del stack entero up (TLS + dominio) ocurre en Hetzner.
# ════════════════════════════════════════════════════════════════════════════

# Imagen que comparten backend, provision, celery-worker y celery-beat.
# RUNTIME=runtime-lean = SIN instrumental de pentest. Medido el 2026-09-10 con
# `docker images`: 2,79 GB frente a los 7,92 GB de la imagen de una sola pieza
# que traia nuclei/prowler/scoutsuite/trivy/checkov/semgrep dentro.
#
# CONSECUENCIA, y hay que saberla: en estos cuatro servicios los escaneres reales
# quedan como NO disponibles. No revientan — mcp_client.scanner_capability()
# devuelve available=false con su razon y invoke_mcp corta limpio — pero un
# USE_MCP_REAL=true aqui no ejecutara nmap, nuclei ni prowler. Para escaneo real
# se construye la otra variante:
#   docker compose -f docker-compose.yml --profile scanner build fulkro-scanner-tools
# Ver docs/adr/ADR-002-imagen-backend-sin-instrumental-pentest.md
x-backend-image: &backend-image
  build:
    context: .
    dockerfile: infra/docker/Dockerfile
    args:
      RUNTIME: runtime-lean
  image: fulkro/backend:prod

services:

  # ─────────────────────── PostgreSQL 16 ───────────────────────
  # Imagen propia: pgvector + Apache AGE + pgAudit (Dockerfile.postgres).
  # init-extensions / init-functions / init-roles montados en initdb.d en ORDEN
  # (01/02/03) → se ejecutan AUTO en el PRIMER arranque (data-dir vacío).
  # El servicio `provision` los reejecuta (idempotente) para cubrir volúmenes
  # pre-existentes y garantizar orden explícito antes de alembic/seed.
  postgres:
    build:
      context: ./infra/docker
      dockerfile: Dockerfile.postgres
    image: fulkro/postgres:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fulkro}
      POSTGRES_USER: ${POSTGRES_USER:-fulkro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido en .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # feat/fulkro-100 Ola E · repo pgBackRest persistente (PITR · backup físico).
      - pgbackrest_repo:/var/lib/pgbackrest
      - ./infra/docker/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      - ./infra/docker/init-functions.sql:/docker-entrypoint-initdb.d/02-functions.sql:ro
      - ./infra/docker/init-roles.sql:/docker-entrypoint-initdb.d/03-roles.sql:ro
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pgaudit"
      # feat/fulkro-100 Ola E · WAL archiving para PITR (pgBackRest). archive-push
      # asíncrono (no bloquea el primario); falla hasta stanza-create (provision)
      # y reintenta · para piloto bajo tráfico el WAL acumulado es mínimo.
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=pgbackrest --stanza=fulkro archive-push %p"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fulkro} -d ${POSTGRES_DB:-fulkro}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    shm_size: "256mb"
    networks:
      - fulkro-net
    # NO publicamos 5432 al host en prod (acceso solo intra-red · Caddy/Hetzner
    # firewall). Si se necesita túnel admin, usar `docker exec` o SSH port-forward.

  # ─────────────────────── Redis 7 ───────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # FIX P3-1: requirepass (defensa en profundidad · red interna). La password
    # viene de .env.prod (generate-prod-secrets.sh). backend/worker/beat la
    # consumen vía FULKRO_REDIS_URL (con password) del env_file.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD requerido en .env.prod}
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD requerido en .env.prod}"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - fulkro-net

  # ─────────────────────── Provision (one-shot) ───────────────────────
  # Corre la secuencia inviolable y termina. backend/celery dependen de que
  # complete OK (service_completed_successfully). Re-ejecutable (idempotente).
  provision:
    <<: *backend-image
    restart: "no"
    env_file:
      - .env.prod
    environment:
      PROVISION_PGHOST: postgres
      PROVISION_PGPORT: "5432"
      PROVISION_PGDB: ${POSTGRES_DB:-fulkro}
      PROVISION_SUPER_USER: ${POSTGRES_USER:-fulkro}
      PROVISION_SUPER_PW: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido en .env.prod}
      # Nombre canónico (= generate-prod-secrets.sh + .env.prod.template).
      # Antes leía FULKRO_MIGRATE_PASSWORD (typo) → caía al dev pwd → mismatch B3.
      PROVISION_MIGRATE_PW: ${FULKRO_MIGRATE_DB_PASSWORD:-fulkro_migrate_dev_password}
      # Password del rol runtime fulkro_app (la consume el ALTER USER del entrypoint
      # para alinear el rol al DATABASE_URL del backend · idempotente).
      PROVISION_APP_PW: ${FULKRO_APP_DB_PASSWORD:-fulkro_app_dev_password}
      PROVISION_REPO_ROOT: /app
      # En Hetzner hay fastembed + (opcional) AGE superuser. Si están listos,
      # poner PROVISION_SEED_FLAGS="" para seed completo. Default conservador:
      PROVISION_SEED_FLAGS: ${PROVISION_SEED_FLAGS:---skip-corpus --skip-age-kg}
    volumes:
      # Ya no es obligatorio: desde que .dockerignore niega `!infra/docker/*.sh`
      # y `!infra/docker/*.sql`, la imagen copia el entrypoint y los init-*.sql.
      # Verificado con: docker run --rm fulkro/backend:prod ls -la /app/infra/docker
      # Se conserva para poder corregir un .sql en el servidor sin reconstruir.
      - ./infra/docker:/app/infra/docker:ro
      # FIX docx (2026-06-14): seed_templates fija docx_path SOLO si el DOCX
      # existe; provision no monta vardata y la imagen no copia var/ → el
      # catálogo quedaba con docx_path NULL → 404 en generación. Bind del árbol
      # git para que el seed escriba docx_path correcto en la tabla templates.
      - ./var/templates_docx:/app/var/templates_docx:ro
    entrypoint: ["bash", "/app/infra/docker/provision-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fulkro-net

  # ─────────────────────── Backend FastAPI (uvicorn) ───────────────────────
  # Alias de red `app` → el Caddyfile.prod hace `reverse_proxy app:8000`.
  backend:
    <<: *backend-image
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      # FIX P3-4: cache de modelos HuggingFace (embeddings e5-large in-process)
      # bajo el volumen persistente vardata → se descarga 1 vez y sobrevive a un
      # recreate (evita ~2GB de descarga en cada arranque del contenedor).
      HF_HOME: /app/var/hf-cache
    volumes:
      # FIX P0-1: /app/var persistente COMPARTIDO con celery-worker. Necesario
      # para datos que deben sobrevivir un recreate (evidencias en filesystem
      # hasta la migración a MinIO, fallback dev de claves, artefactos). Las
      # claves de firma de PRODUCCIÓN vienen de env (FULKRO_M0X_SIGNING_*), no
      # de este volumen, pero el volumen evita pérdida de cualquier otro var/*.
      - vardata:/app/var
      # FIX docx (2026-06-14): los DOCX de plantilla son artefactos BUILD-TIME
      # (no runtime). El volumen vardata enmascara /app/var y la imagen no copia
      # var/ → /app/var/templates_docx quedaba VACÍO → /documents/generate daba
      # 404 'DOCX file not found' para TODOS los entregables en prod. Bind
      # read-only del árbol git (git pull lo mantiene fresco).
      - ./var/templates_docx:/app/var/templates_docx:ro
    command:
      - "uvicorn"
      - "backend.app.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--workers"
      - "4"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      provision:
        condition: service_completed_successfully
    networks:
      fulkro-net:
        aliases:
          - app

  # ─────────────────────── Celery worker ───────────────────────
  celery-worker:
    <<: *backend-image
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      # FIX P3-4: mismo cache HF persistente que backend (tareas RAG embeben).
      HF_HOME: /app/var/hf-cache
    volumes:
      # FIX P0-1: MISMO volumen var que backend (el worker escribe evidencias /
      # artefactos en filesystem que el backend sirve en descarga · deben
      # compartir el almacén hasta la migración completa a MinIO).
      - vardata:/app/var
      # FIX docx (2026-06-14): mismo bind read-only que backend (las tareas que
      # rinden entregables necesitan los DOCX de plantilla · ver backend).
      - ./var/templates_docx:/app/var/templates_docx:ro
    command:
      - "celery"
      - "-A"
      - "backend.app.core.celery_app"
      - "worker"
      - "--loglevel=info"
      - "--concurrency=2"
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.app.core.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      provision:
        condition: service_completed_successfully
    networks:
      - fulkro-net

  # ─────────────────────── Celery beat (scheduler) ───────────────────────
  celery-beat:
    <<: *backend-image
    restart: unless-stopped
    env_file:
      - .env.prod
    command:
      - "celery"
      - "-A"
      - "backend.app.core.celery_app"
      - "beat"
      - "--loglevel=info"
      # USER no-root (10001): el schedule DB por defecto se escribe en el CWD
      # /app (root-owned) → Permission denied. /tmp siempre es escribible.
      - "--schedule=/tmp/celerybeat-schedule"
    depends_on:
      redis:
        condition: service_healthy
      provision:
        condition: service_completed_successfully
      celery-worker:
        condition: service_started
    networks:
      - fulkro-net

  # ─────────────────────── Frontend Next.js 14 ───────────────────────
  # next start. FULKRO_AUTH_PUBLIC_KEY SÍ es runtime (middleware.ts la lee de
  # process.env en cada peticion).
  # FULKRO_BACKEND_URL NO lo es, aunque aquí ponía que sí: `next build` hornea
  # el destino de los rewrites en .next/routes-manifest.json (medido 2026-09-10,
  # bloque D · D3, sobre el demo: la variable estaba bien en runtime y el
  # manifiesto seguía diciendo localhost:8000 → 500 en toda llamada del
  # navegador). Va como build-arg, y se deja además en runtime por si cambia.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        FULKRO_BACKEND_URL: http://backend:8000
    image: fulkro/frontend:prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Proxy interno /api/* → backend (override del default localhost).
      FULKRO_BACKEND_URL: http://backend:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fulkro-net

  # ─────────────────────── MinIO (S3-compatible) ───────────────────────
  # Object Lock se habilita por bucket en minio-init (fulkro-evidence-worm).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER requerido en .env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD requerido en .env.prod}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - fulkro-net
    # Consola 9001 NO publicada al host en prod (acceso vía SSH tunnel/Caddy).

  # ─────────────────────── MinIO bucket bootstrap (one-shot) ───────────────────────
  minio-init:
    image: minio/mc:latest
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/minio-init.sh"]
    environment:
      MINIO_INIT_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER requerido en .env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD requerido en .env.prod}
    volumes:
      - ./infra/docker/minio-init.sh:/scripts/minio-init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - fulkro-net

  # ─────────────────────── ClamAV antivirus ───────────────────────
  # clamd TCP 3310 interno · DB de firmas persistente · cold-start ~2 min.
  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    volumes:
      - clamavdata:/var/lib/clamav
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
      CLAMAV_NO_CLAMD: "false"
      CLAMD_STARTUP_TIMEOUT: "300"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    networks:
      - fulkro-net

  # ─────────────────────── embeddings (IN-PROCESS · sin contenedor) ──────────────
  # NO hay servicio fastembed. El backend vectoriza IN-PROCESS con la librería
  # Python `fastembed` (TextEmbedding · intfloat/multilingual-e5-large · ONNX/CPU ·
  # ver backend/app/core/ai/embeddings.py · el modelo se descarga lazy a la caché
  # del contenedor backend). El antiguo contenedor TEI (:8080) era un PLACEHOLDER
  # que el código NO consumía (embeddings_endpoint vestigial) y crash-looping al
  # bajar el modelo → eliminado (deploy 2026-06-10).

  # ─────────────────────── Caddy (reverse proxy · TLS) ───────────────────────
  # Caddyfile.prod monta · proxy a `app:8000` (alias del backend) + /static.
  #
  # HONEST NOTE (frontend routing): el Caddyfile.prod existente proxya TODO a
  # `app:8000` (modelo backend-sirve-todo). Con frontend Next.js separado, en
  # Hetzner añadir al Caddyfile una ruta para el frontend, p.ej.:
  #     reverse_proxy /api/* app:8000        # API → backend
  #     reverse_proxy frontend:3000          # resto → Next.js
  # (o un handle_path por prefijo). Se documenta · NO se reescribe aquí para no
  # tocar el Caddyfile.prod endurecido sin validación en server real.
  #
  # rate_limit en Caddyfile.prod requiere binario con módulo caddy-ratelimit
  # (xcaddy build --with github.com/mholt/caddy-ratelimit). La imagen caddy:2
  # estándar NO lo trae → o se construye imagen custom o se comenta el bloque
  # (la app conserva BodySizeLimitMiddleware + cap LLM como defensa en profundidad).
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (h3)
    volumes:
      - ./infra/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - ./landing:/srv/landing:ro
      - caddydata:/data
      - caddyconfig:/config
      - caddylogs:/var/log/caddy
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - fulkro-net


# ════════════════════════════════════════════════════════════════════════════
networks:
  fulkro-net:
    driver: bridge


# ════════════════════════════════════════════════════════════════════════════
volumes:
  pgdata:
  pgbackrest_repo:   # feat/fulkro-100 Ola E · repo pgBackRest (PITR · físico + WAL)
  redisdata:
  miniodata:
  clamavdata:
  caddydata:
  caddyconfig:
  caddylogs:
  vardata:   # FIX P0-1 · /app/var persistente compartido backend + celery-worker
