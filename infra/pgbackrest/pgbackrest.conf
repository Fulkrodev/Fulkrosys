# ════════════════════════════════════════════════════════════════════════════
# FULKRO · pgBackRest configuration · PRODUCCIÓN (Hetzner)
# ════════════════════════════════════════════════════════════════════════════
# Motor 26 (m26_backup) registra/orquesta los jobs a nivel app (BackupJob +
# encryption Fernet + offsite MinIO/Hetzner Object Storage). pgBackRest es la
# capa de cluster: full + incremental + WAL archiving + PITR del PostgreSQL.
# Las dos capas son COMPLEMENTARIAS, no redundantes:
#   - pgBackRest  → backup físico del cluster (PITR, restore byte-exacto).
#   - m26 offsite → artefactos lógicos cifrados (dumps, exports audit_log).
#
# Este fichero es una PLANTILLA. Los valores REALES (passwords, claves S3) se
# inyectan en el deploy desde .env.prod vía `scripts/deploy-hetzner.sh` ó se
# editan a mano en el servidor. NUNCA commitear secretos aquí.
#
# Stanza canónica = PGBACKREST_STANZA (.env.prod · default "fulkro").
# Alinear `[fulkro]` abajo con ese valor si se cambia.
#
# Frontera honesta: este .conf SÓLO es operativo EN EL SERVIDOR Hetzner con un
# PostgreSQL accesible localmente (socket/TCP) y pgbackrest instalado. NO se
# valida en el entorno de desarrollo Windows/WSL (no hay cluster prod local).
# Ver docs/deploy/HETZNER_DEPLOY_RUNBOOK.md §5.
# ════════════════════════════════════════════════════════════════════════════

[global]
# ── Repositorio 1 · LOCAL (disco del servidor) ──────────────────────────────
# Repo siempre-disponible en disco (RPO bajo, restore rápido). El repo S3
# offsite (repo2) es la copia 3-2-1 fuera de sitio.
repo1-path=/var/lib/pgbackrest
repo1-retention-full=4
repo1-retention-diff=12
# Cifrado en reposo del repo local (AES-256-CBC nativo de pgBackRest).
# La passphrase se inyecta desde BACKUP_ENCRYPTION_KEY (.env.prod) en deploy.
repo1-cipher-type=aes-256-cbc
# repo1-cipher-pass se setea por entorno: PGBACKREST_REPO1_CIPHER_PASS
# (deploy-hetzner.sh lo exporta desde BACKUP_ENCRYPTION_KEY). NUNCA en claro aquí.

# ── Repositorio 2 · OFFSITE S3 (Hetzner Object Storage / BACKUP_S3_*) ────────
# 3-2-1: 3 copias, 2 medios, 1 offsite. Este es el "1 offsite".
# Descomentar y rellenar en el servidor cuando BACKUP_S3_* esté provisionado.
# Todos los valores vienen de .env.prod (BACKUP_S3_ENDPOINT/BUCKET/ACCESS/SECRET).
#repo2-type=s3
#repo2-path=/pgbackrest
#repo2-s3-bucket=BACKUP_S3_BUCKET          # ej. fulkro-backups
#repo2-s3-endpoint=BACKUP_S3_ENDPOINT      # ej. nbg1.your-objectstorage.com (Hetzner Nuremberg)
#repo2-s3-region=eu-central                # Hetzner ignora región pero pgbackrest la exige
#repo2-s3-key=BACKUP_S3_ACCESS_KEY
#repo2-s3-key-secret=BACKUP_S3_SECRET_KEY
#repo2-s3-uri-style=path                   # Hetzner Object Storage usa path-style
#repo2-retention-full=4
#repo2-retention-diff=12
#repo2-cipher-type=aes-256-cbc
# repo2-cipher-pass se setea por entorno PGBACKREST_REPO2_CIPHER_PASS (= repo1).

# ── Comportamiento global ───────────────────────────────────────────────────
# Comprime con zstd (rápido + buen ratio). Verifica checksums al hacer backup.
compress-type=zst
compress-level=6
# Procesos paralelos para backup/restore (ajustar a vCPUs del servidor Hetzner).
process-max=4
# Verificación de integridad de cada página leída del backup.
repo1-bundle=y
# Logging: el detalle va a /var/log/pgbackrest; consola sólo info.
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest
# Hard-link de full→incr para ahorrar espacio en repo local.
delta=y
# Timeout generoso para archivos grandes a S3.
archive-timeout=120

[global:archive-push]
# WAL archiving asíncrono (no bloquea el cluster bajo carga).
compress-level=3
archive-async=y
spool-path=/var/spool/pgbackrest

# ════════════════════════════════════════════════════════════════════════════
# STANZA · debe coincidir con PGBACKREST_STANZA (.env.prod · default "fulkro")
# ════════════════════════════════════════════════════════════════════════════
[fulkro]
# Conexión al cluster a respaldar. En el servidor Hetzner pgBackRest corre
# junto al PostgreSQL (mismo host) y usa el socket/puerto local.
# pg1-path = data dir del cluster. Si Postgres corre en contenedor con volumen
# montado, apuntar al path del HOST (p.ej. el volumen docker `pgdata`).
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=postgres
# pg1-host-* sólo si pgbackrest corre en un host distinto al del cluster.
# pg1-database por defecto = postgres (control DB); las DBs reales se respaldan
# todas (backup de cluster completo, incluye `fulkro`).
