# Reparto por turnos entre las replicas del backend · BLOQUE D · D4.
#
# Existe SOLO para responder con una medicion a la pregunta "¿esto escala en
# horizontal?". No forma parte del demo ni de produccion.
#
# `upstream` sin directiva de politica usa round-robin, que es lo pedido: dos
# peticiones seguidas de la MISMA sesion caen en replicas DISTINTAS. Si algo del
# backend guarda estado en la memoria del proceso, con esto se rompe.
#
# La cabecera X-Replica dice que replica ha servido cada peticion. Sin ella,
# "funciona" no distingue entre "funciona repartido" y "todo ha caido siempre
# en la misma replica".

upstream backends {
    # `backend` resuelve por DNS interno de compose a TODAS las replicas.
    # `resolve` no existe en nginx libre; se usa el resolver de Docker con una
    # variable para que la resolucion sea en cada peticion y no al arrancar.
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Resolver de Docker: sin esto nginx cachea la IP de la PRIMERA replica al
    # arrancar y no reparte nada (fallo clasico, y silencioso).
    resolver 127.0.0.11 valid=1s ipv6=off;

    location / {
        set $destino "http://backend:8000";
        proxy_pass $destino;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Quien ha servido esto. Es la mitad de la medicion.
        add_header X-Replica $upstream_addr always;

        # SSE: sin esto nginx acumula y el evento no llega.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
