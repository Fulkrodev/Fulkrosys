# FULKRO · pgBackRest config (PITR · Point-In-Time Recovery con WAL).
# feat/fulkro-100 Ola E. Repo LOCAL en el servidor (gratis · sin cloud de pago).
# Stanza 'fulkro' apunta al PGDATA del contenedor. archive_command (en el command
# del servicio postgres) hace archive-push de cada WAL a este repo → permite
# restaurar a CUALQUIER instante (no solo a los dumps diarios pg_dump).
#
# Retención: 4 backups full (rota los más antiguos · el repo no crece sin límite).
# Complementa (no sustituye) el pg_dump diario lógico: pgBackRest = físico + PITR.
[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=4
# Comprime los WAL/backups (ahorra disco · gratis).
compress-type=zst
compress-level=3
# Push SÍNCRONO (piloto bajo tráfico): el WAL se archiva al instante → 'check'
# fiable y sin acumulación. (async se reservaría para primarios de alto WAL.)
log-level-console=info
log-level-file=detail

[fulkro]
pg1-path=/var/lib/postgresql/data
# El superuser del cluster es 'fulkro' (POSTGRES_USER), NO 'postgres' (que no
# existe como rol). pgbackrest conecta por socket local (trust) como este rol
# para stanza-create/check/backup. Verificado local: sin esto → "no database found".
pg1-user=fulkro
pg1-database=fulkro
