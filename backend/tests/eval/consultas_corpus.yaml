# Conjunto de consultas etiquetado para evaluar la recuperación del corpus.
#
# ─── PROCEDIMIENTO (importa el ORDEN, y este fichero es la prueba de que se siguió) ───
#
# La trampa clásica de un conjunto de evaluación de RAG es escribir las consultas
# MIRANDO los fragmentos. Sale una consulta que es una paráfrasis del fragmento que
# la responde, el recall se dispara y la medición no vale nada.
#
# Aquí se hizo al revés, y en dos pasos separados:
#
#   1. Se escribieron las 50 preguntas PRIMERO, desde conocimiento del dominio
#      normativo (RGPD, DORA, NIS2, RD 311/2022, eIDAS), SIN abrir un solo
#      fragmento del corpus, y se volcaron a este fichero con `relevantes: []`.
#      Ese volcado es el commit «anota 50 consultas de cumplimiento escritas sin
#      mirar el corpus»: quien dude puede comprobar con `git show` que en ese
#      commit las listas de relevantes estaban VACÍAS.
#   2. Sólo DESPUÉS se etiquetó a mano qué fragmentos las responden, leyendo el
#      corpus por SQL y por palabras clave. Eso es legítimo: etiquetar exige mirar.
#
#   Ninguna consulta se reescribió después de etiquetar. Las que resultaron no
#   tener respuesta en el corpus se marcan `relevantes: []` y `sin_relevante: true`,
#   y se EXCLUYEN del cálculo de métricas (el informe dice cuántas son). Reescribir
#   una consulta para que encaje con lo que el corpus tiene es cometer la trampa
#   por la puerta de atrás.
#
# ─── SESGO, DICHO EN VOZ ALTA ───
#
# Etiquetado por: Claude Opus 5, en la sesión del BLOQUE F, a petición de Marcos Mata.
# Método: lectura de fragmentos por SQL (ILIKE sobre `content` con los términos de
#   la consulta) + revisión manual del texto de cada candidato. Relevancia binaria:
#   un fragmento es relevante si, leído solo, responde la pregunta.
#
# EL SESGO EVIDENTE: lo etiqueta quien conoce el corpus Y el sistema que se evalúa.
# Quien etiqueta sabe que hay un buscador léxico detrás (`ts_rank_cd`; se llamó
# «BM25» hasta 2026-09-11 y no lo es), y al buscar candidatos por palabras clave
# está usando una herramienta emparentada con una de las tres ramas que se miden.
# Eso puede favorecer sistemáticamente a la rama léxica en el etiquetado: un
# fragmento que responde la pregunta pero NO comparte vocabulario con ella tiene
# más probabilidad de no haber sido encontrado por el etiquetador, y por tanto de
# faltar en `relevantes`. La rama vectorial es la que más pierde con ese sesgo.
# No invalida la comparación, pero la tiñe en una dirección conocida, y callarlo
# sí la invalidaría. Un segundo etiquetador independiente lo corregiría; no lo hay.
#
# ─── FORMATO ───
#   id          identificador estable (no reutilizar si se borra una consulta)
#   norma       RGPD | DORA | NIS2 | RD_311_2022 | EIDAS
#   texto       la pregunta, tal como la escribiría quien lleva el cumplimiento
#   relevantes  lista de chunk_id (UUID de knowledge_chunks) que la responden
#   sin_relevante  true si el corpus no la responde (se excluye del cálculo)

# ─── RESULTADO DEL ETIQUETADO (2026-09-10) ───
#   50 consultas escritas · 49 con al menos un fragmento relevante · 96 etiquetas
#   en total (media 1,96 relevantes por consulta).
#   1 consulta EXCLUIDA del calculo de metricas por no tener respuesta en el corpus:
#     - dora-03 «¿Que plazo hay para notificar un incidente grave relacionado con las
#       TIC a la autoridad competente?» · el texto de DORA que hay en el corpus
#       (art. 19) remite los plazos concretos a normas tecnicas de regulacion que NO
#       estan en el corpus; comprobado buscando «informe intermedio», «notificacion
#       inicial» y el articulado de los art. 19 y 20. NO se reescribio la consulta
#       para que encajara: se marca y se excluye.
#   Denominador de todas las metricas del informe: 49.

version: 1
corpus:
  tabla: knowledge_chunks
  fragmentos: 1031
  reparto: {UE-RGPD: 295, UE-DORA: 266, UE-NIS2: 228, RD_311_2022: 127, UE-EIDAS: 115}

consultas:

