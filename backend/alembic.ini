[alembic]
script_location = migrations
# SIN valor a proposito. La URL la fija migrations/env.py desde
# DATABASE_MIGRATE_URL, y aborta si falta. Antes aqui habia
# postgresql://fulkro:changeme@localhost:5433/fulkro, o sea la base de
# DESARROLLO: cualquier `alembic upgrade head` lanzado sin exportar la
# variable la migraba en silencio.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
