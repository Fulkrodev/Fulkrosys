subject_es: "Cliente inactivo {{ days_inactive }} días · {{ client_name }}"
cta_label_es: "Abrir cliente"
html_body_es: |
  <p>Hola Marcos,</p>
  <p>El cliente <strong>{{ client_name }}</strong> lleva
  <strong>{{ days_inactive }} días</strong> sin actividad en el portal.
  Último acceso: {{ last_login_date }}.</p>
  {% if last_task_completed %}
  <p style="color:#666;font-size:14px;">
  Última tarea completada: {{ last_task_completed }}
  </p>
  {% endif %}
  <p>Considera enviar un check-in directo o reagendar una sesión de
  retainer si procede.</p>
  <p>
    <a href="{{ cta_url }}" style="background:#7c3aed;color:#fff;padding:10px 20px;text-decoration:none;border-radius:4px;display:inline-block;">
      Abrir ficha del cliente
    </a>
  </p>
  <p>—<br>FULKRO Notification Orchestrator</p>
text_body_es: |
  Hola Marcos,

  El cliente {{ client_name }} lleva {{ days_inactive }} días sin
  actividad en el portal. Último acceso: {{ last_login_date }}.

  {% if last_task_completed %}
  Última tarea completada: {{ last_task_completed }}
  {% endif %}

  Considera enviar un check-in directo o reagendar una sesión de
  retainer si procede.

  Abrir ficha del cliente: {{ cta_url }}

  —
  FULKRO Notification Orchestrator
