subject_es: "Comité Retainer {{ period_quarter }} firmado · {{ project_name }}"
cta_label_es: "Ver comité retainer"
html_body_es: |
  <p>Hola {{ recipient_name }},</p>
  <p>Has firmado el <strong>Comité Retainer {{ period_quarter }}</strong>
  del proyecto <strong>{{ project_name }}</strong> el
  {{ signed_at_short }}.</p>
  <p>Estado del trimestre · RAG: <strong>{{ rag_overall }}</strong>:</p>
  <ul>
    <li>Actividades completadas: {{ activities_completed }}</li>
    <li>Incidentes detectados: {{ incidents_detected }}</li>
    <li>Vulnerabilidades críticas: {{ vulns_critical }}</li>
  </ul>
  <p>La firma queda integrada en la trazabilidad ENAC del retainer ·
  audit checkpoint trimestral confirmado.</p>
  <p>
    <a href="{{ cta_url }}" style="background:#7c3aed;color:#fff;padding:10px 20px;text-decoration:none;border-radius:4px;display:inline-block;">
      Ver detalle del comité
    </a>
  </p>
  <p>Un saludo,<br>
  <strong>Marcos Mata</strong> · Consultor de Fulkro<br>
  📞 +34 637 165 328 ·
  <a href="mailto:marcosmata@fulkro.es">marcosmata@fulkro.es</a> ·
  <a href="https://www.fulkro.es">www.fulkro.es</a></p>
