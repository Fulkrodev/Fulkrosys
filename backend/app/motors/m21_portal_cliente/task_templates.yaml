  # ---------- PRE_VENTA · 2 templates ----------

  - id: ENR_PV_01_LEAD_QUALIFICATION_DEEP
    phase: pre_venta
    applicable_categories: "ALL"
    applicable_archetypes: "ALL"
    is_enriched: true
    order_within_phase: 1
    title: Cualificación profunda lead pre-contrato
    description: Análisis comercial completo del lead pre-contract signing.
    description_detailed_es: >
      Marcos completa scoring 19 dimensiones del lead vía reunión exploratoria
      (m_meetings) + research público + LinkedIn. Output: M10 temperature score
      actualizado + criterios fit con perfil ideal (memoria 22 PILOTO).
    rationale_es: >
      Sin cualificación profunda · pipeline incluye leads cold sin probabilidad
      cierre · waste de tiempo. Filtrar antes de invertir horas en propuesta.
    cta_label: Cualificar lead
    cta_url: /admin/leads
    deliverable_codes: []
    actors: [Marcos, lead_decisor]
    completion_criteria_detailed:
      - Scoring M10 actualizado (>=60 para continuar)
      - Categoría target tentativa identificada (BÁSICA/MEDIA/ALTA)
      - Decisor único confirmado (NO comité largo)
      - Presupuesto >= tarifa categoría confirmado
    estimated_days: 3
    priority: 8

  - id: ENR_PV_02_PROPOSAL_GENERATION
    phase: pre_venta
    applicable_categories: "ALL"
    applicable_archetypes: "ALL"
    is_enriched: true
    order_within_phase: 2
    title: Generar propuesta P-001 + tarifa
    description: A19 redactor propuestas genera P-001 con tarifa adaptada.
    description_detailed_es: >
      Agente A19 toma input de cualificación lead + categoría target + extras
      (multi-sector · multi-ubicación · madurez L0-L1 · sistemas adicionales) ·
      genera P-001 con desglose tarifa + hitos pago.
    rationale_es: >
      Tarifa fija pre-acordada (BÁSICA 3.900€ · MEDIA 9.500€ · ALTA 25.000€+)
      con extras objetivos · evita negociación tarifa cliente-by-cliente · brand
      consistency Marcos consultor commodity-resistant.
    cta_label: Generar P-001
    cta_url: /admin/leads
    deliverable_codes: [P-001]
    actors: [Marcos, A19_redactor_propuestas]
    prerequisite_template_ids: [ENR_PV_01_LEAD_QUALIFICATION_DEEP]
    estimated_days: 2
    priority: 9

