# ClientTask templates · 18 templates ADR-038 SAN-D MB-14.3
# Cobertura: workflow_phase × categoría B/M/A + arquetipos PYME
# Templates auto-generan tasks per project en transition workflow phase.
#
# Schema:
#   id                       · canonical template_id (DB unique)
#   phase                    · WorkflowPhase value (pre_venta..retainer_cierre)
#   applicable_categories    · list ["BASICA","MEDIA","ALTA"] o "ALL"
#   applicable_archetypes    · list lowercase enum o "ALL"
#   title                    · texto humano UI
#   description              · descripción larga
#   cta_label                · botón texto
#   cta_url                  · ruta cliente portal target
#   expected_evidence_type   · evidence_type_id si pide upload (opcional)
#   expected_evidence_count  · default 1 (opcional)
#   priority                 · 0=lowest · más alto = más prominente UI
#   estimated_days           · indicativo · days_to_due_date opcional

version: "1.0.0"

