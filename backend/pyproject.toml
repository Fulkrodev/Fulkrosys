[project]
name = "fulkro"
version = "0.1.0"
description = "FULKRO - Plataforma de implantacion ENS (RD 311/2022)"
requires-python = ">= 3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=3.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    # Driver SINCRONO para Alembic. env.py convierte DATABASE_MIGRATE_URL
    # (postgresql+asyncpg://) a postgresql:// → SQLAlchemy usa psycopg2 por
    # defecto en las migraciones. El runtime de la app usa asyncpg; psycopg2
    # SOLO lo necesita `alembic upgrade head` (servicio provision). Sin el, el
    # provision de produccion falla con ModuleNotFoundError (deploy 2026-06-10).
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "celery[redis]>=5.4",
    "httpx>=0.27",
    "anthropic>=0.40",
    "fastembed>=0.4.2",
    "pgvector>=0.3.6",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3",
    "PyJWT[crypto]>=2.8",
    "pyotp>=2.9",
    "passlib[bcrypt]>=1.7",
    "PyNaCl>=1.5",
    # feat/fulkro-100 Ola D · sellado de tiempo RFC 3161 (módulo asn1crypto.tsp
    # para TimeStampReq/Resp). Pure-python (sin C) · import lazy en
    # core/timestamping → degradación honesta si ausente.
    "asn1crypto>=1.5",
    # WebAuthn/FIDO2 (Yubikey · Marcos R4). El código importa `fido2`
    # (python-fido2 de Yubico, 2.x) en backend/app/auth/webauthn_svc.py.
    # NO es el paquete `py-webauthn` (que no pasa de 0.0.6 en PyPI).
    "fido2>=2.2",
    "docxtpl>=0.18",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    # Fase 1.E E.2 · propuesta PDF generator (radar outbound · Marcos cement 2026-05-27)
    "reportlab>=4.0",
    "svglib>=1.5,<2.0",
    "openpyxl>=3.1",
    "loguru>=0.7",
    "tenacity>=9.0",
    "boto3>=1.35",
    "paramiko>=3.4",
    # SAN-D MB-16.3 · NotificationOrchestrator templates YAML + Jinja2 (ADR-039).
    "Jinja2>=3.1",
    # SAN-E MB-9.bis mini-atom · MJML email design system (compliance templates).
    "mjml-python>=1.4",
    "PyYAML>=6.0",
    # SAN-E MB-6 atom 6 · ClamAV antivirus scan client uploads (ENS mp.s.5).
    "clamd>=1.0.2",
    # M10 ENS Radar · fuzzy matching (CCN cross-check, ICP blacklist, dedup).
    "rapidfuzz>=3.0",
    # M10 ENS Radar · scraping CCN headless (portal sirve datos solo a navegador).
    # Tras instalar: `playwright install chromium`.
    "playwright>=1.40",
    # MinIO SDK · cliente central de almacenamiento (core/storage/minio_client.py
    # + m26_backup/offsite.py). Lo importa el grafo de backend.app.main al arrancar
    # uvicorn: sin él el backend NO bootea en la imagen de prod (validación deploy
    # 2026-06-08 · `import backend.app.main` lo destapó como dep no declarada).
    "minio>=7.2",
    # libphonenumber port · m31_whatsapp/service.py (normalización E.164). Igual que
    # minio: importado por el grafo de backend.app.main → requerido para arrancar.
    "phonenumbers>=8.13",

    # ---------------------------------------------------------------------
    # 2026-09-10 · C0.2 · dependencias que el código YA importaba sin declarar.
    # Criterio: va a `dependencies` (base) todo lo que se importa a nivel de
    # módulo, o sin `try/except ImportError`, dentro del paquete `app`. Sin
    # declararlas, `pip install -e backend` producía un entorno que NO puede
    # ni coleccionar los tests ni ejecutar el motor MAGERIT.
    # ---------------------------------------------------------------------

    # Import DURO a nivel de módulo en app/corpus/rd311_parser.py:22
    # (`from bs4 import BeautifulSoup, Tag`). Es el parser determinista del
    # RD 311/2022 consolidado del BOE → 73 medidas del Anexo II. Sin él,
    # `backend/tests/corpus/test_rd311_parser.py` ni siquiera se colecciona.
    # Medido: command grep -rEn "^[[:space:]]*(from|import)[[:space:]]+bs4\b" backend/ --include=*.py
    "beautifulsoup4>=4.12",

    # Import DURO a nivel de módulo en app/corpus/ccn_pdf_ingest.py:43
    # (`import pypdf`). Ingesta del corpus CCN-STIC en PDF. NO llega por
    # transitividad: pdfplumber usa pdfminer.six, no pypdf.
    # Medido: command grep -rEn "^[[:space:]]*(from|import)[[:space:]]+pypdf\b" backend/ --include=*.py
    "pypdf>=4.0",

    # Import perezoso pero SIN GUARDA en app/motors/m02_magerit/service.py:542
    # (`import networkx as nx`, dentro del cálculo de valor acumulado MAGERIT v3
    # Libro III sec 2.2.2). A diferencia de ldap3/qrcode/xmlsec, aquí NO hay
    # try/except ImportError: sin networkx el motor m02 revienta en ejecución.
    # Motor de núcleo → dependencia base, no opcional.
    "networkx>=3.0",

    # ---- Las cuatro siguientes ya llegaban, pero DE REBOTE ----
    # Se importan directamente desde `app` y hoy sólo aparecen porque las
    # arrastran extras de terceros. Se declaran explícitamente para que el
    # arranque no dependa de decisiones de empaquetado ajenas.

    # 18 ficheros de app/ la importan a nivel de módulo (Ed25519 en
    # m07_evidence/signing.py, m_remediation/agent_protocol.py,
    # m25_lifecycle/backup_builder.py; Fernet en m26_backup/encryption.py y
    # m16_onboarding/token_encryption.py). Sostiene las firmas Ed25519 y la
    # cadena de hash inmutable (R6). Hoy entra por el extra de
    # python-jose[cryptography] / PyJWT[crypto] — dos paquetes con 0 imports
    # directos en el repo y, por tanto, candidatos naturales a una poda futura
    # que decapitaría el arranque en silencio.
    # Medido: 18 ficheros en app/, 9 en tests/.
    "cryptography>=42.0",

    # 2 ficheros de app/ lo importan directamente. Hoy entra por el extra
    # passlib[bcrypt] (passlib: 0 imports directos). Mismo razonamiento.
    "bcrypt>=4.0",

    # 2 ficheros de app/ lo importan directamente. Hoy entra de rebote por
    # python-docx / docxtpl / mjml-python.
    "lxml>=5.0",

    # 3 ficheros de app/ lo importan directamente. Hoy entra de rebote por
    # fastembed; si fastembed cambiara de backend de inferencia, desaparecería.
    "numpy>=1.26",

    # 4 ficheros de app/ lo importan directamente (middlewares, responses).
    # FastAPI lo garantiza hoy; se declara sin techo para no pelearse con el
    # rango que fije fastapi, pero dejando constancia del import directo.
    "starlette>=0.37",
]

[project.optional-dependencies]
# `runtime` = dependencias que la APP usa en producción pero que viven aparte
# del core por ser pesadas/opcionales (lazy-import con degradación honesta).
# La imagen de prod (infra/docker/Dockerfile) instala `.[runtime]` (NO `.[dev]`)
# → no arrastra pytest/ruff/mypy al contenedor de producción (menor superficie
# de ataque · imagen más ligera). W9-2 (audit-roundup 2026-06-16 · §5 hardening).
runtime = [
    # Sesion 10 Paso 4.1: mock AWS — lo lazy-importa m08_verification/tools/
    # prowler_runner.py + scoutsuite_runner.py (mock_aws) en RUNTIME, no solo en
    # tests → es dep de producción, no de test.
    "moto[iam,s3,ec2,sts]>=5.0",
    # Sesion 10 Paso 4.3: cliente GMP para OpenVAS/Greenbone — lazy-importado por
    # m08_verification/tools/openvas_runner.py (gvm.connections/protocols) en
    # RUNTIME → dep de producción del escáner.
    "python-gvm>=27.0",

    # ---------------------------------------------------------------------
    # 2026-09-10 · C0.2 · funcionalidad de producción no crítica para arrancar.
    # Las cinco se importan perezosamente (dentro de la función que las usa),
    # ninguna está en el grafo de import de backend.app.main. Van aquí (y no en
    # `dependencies`) porque el backend arranca y sirve sin ellas; van aquí (y
    # no en `dev`) porque lo que habilitan es funcionalidad de producción, no de
    # test — y la imagen de prod instala `.[runtime]`. Ninguna de las cinco
    # necesita cabeceras de sistema ausentes en infra/docker/Dockerfile.
    # Cuatro (ldap3, pytesseract, qrcode, signxml) están además bajo
    # `try/except ImportError` con rama de "no disponible". google-auth NO lo
    # está: sin ella, usar el escritor de Google Workspace lanza ImportError.
    # Se queda en [runtime] igualmente porque sólo es alcanzable si el cliente
    # conecta ese proveedor concreto, y [runtime] SÍ se instala en producción.
    # (Contraste deliberado con networkx, que sí subió a `dependencies`: aquél
    # está en el camino obligatorio del análisis de riesgos de todo proyecto.)
    # ---------------------------------------------------------------------

    # app/motors/m08_verification/tools/ad_password_checker.py:25, dentro de
    # try/except que fija HAS_LDAP3. Auditoría de contraseñas contra Active
    # Directory. Pure python.
    "ldap3>=2.9",

    # app/motors/m07_evidence/content_extraction_service.py:101 y :116, ambos
    # bajo try/except. Es un binding: necesita el binario `tesseract`, que SÍ
    # está en el apt de infra/docker/Dockerfile:21 (tesseract-ocr y
    # tesseract-ocr-spa). Habilita el OCR de imágenes subidas como evidencia.
    "pytesseract>=0.3.10",

    # app/motors/m15_billing/billing_service.py:582, bajo try/except e
    # `if include_qr`. QR de la factura. Pure python.
    "qrcode>=7.4",

    # app/motors/m_remediation/cloud_writers/google_workspace.py:38 y :45
    # (`from google.oauth2 import service_account` / `google.auth.transport`).
    # La distribución se llama google-auth. Pure python.
    "google-auth>=2.28",

    # app/motors/m15_billing/xades_signer.py:40. Es el SEGUNDO intento de la
    # cascada de firma XAdES: el primero es `xmlsec`, que NO se declara (ver
    # nota abajo). signxml firma con `cryptography` puro, sin la extensión C.
    "signxml>=3.2",
]

# ---------------------------------------------------------------------------
# 2026-09-10 · C0.2 · NO DECLARADAS A PROPÓSITO (cuatro imports vivos que se
# quedan fuera). Se documentan aquí para que nadie las "arregle" añadiéndolas
# sin arreglar antes lo que de verdad falta.
#
# · xmlsec — app/motors/m15_billing/xades_signer.py:37. Es una extensión en C
#   que compila contra libxmlsec1-dev y libxml2-dev, y el `apt-get install` de
#   infra/docker/Dockerfile:21 NO instala ninguno de los dos. Declararla en
#   [runtime] rompería en duro el `uv pip install --system -e ".[runtime]"` de
#   la imagen de producción. El código ya la trata como opcional y cae a
#   signxml, que sí se declara.
#
# · pdf2image — app/motors/m07_evidence/content_extraction_service.py:117. El
#   paquete de Python es un envoltorio del binario `pdftoppm` de poppler-utils,
#   que tampoco está en el apt del Dockerfile. Declararla no rompería la
#   instalación, pero convertiría un "OCR de PDF escaneado no disponible"
#   honesto (rama ImportError) en un fallo en tiempo de ejecución capturado más
#   abajo: misma degradación, peor diagnóstico. Se declarará cuando el
#   Dockerfile traiga poppler-utils.
#
# · geoip2 — app/motors/m12_magic_link/service.py:81. El código sale antes de
#   importarla si FULKRO_GEOIP_DB_PATH no apunta a un fichero existente, y esa
#   base de datos de MaxMind no está en el repo ni se descarga en ningún sitio.
#   Declararla instalaría un cliente que nunca puede tener datos que leer.
#
# · shodan — backend/mcp_servers/recon/tools/shodan_tool.py:30. Vive fuera del
#   paquete instalado: [tool.setuptools.packages.find] incluye sólo "app*", así
#   que mcp_servers/ no se empaqueta. Además está condicionada a SHODAN_API_KEY.
#   Su sitio es el requirements propio del servidor MCP, no este pyproject.
# ---------------------------------------------------------------------------
dev = [
    # dev incluye runtime para que CI (`pip install -e .[dev]`) y el dev local
    # sigan teniendo moto + python-gvm disponibles para los tests del motor m08.
    "fulkro[runtime]",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.4",
    "pytest-rerunfailures>=14.0",
    "ruff>=0.7",
    "mypy>=1.11",
    "httpx>=0.27",
    # 2026-09-10 · C0.2 · `import respx` a nivel de módulo en 4 ficheros de
    # test (m16_onboarding: test_m16_connectors, test_oauth_service,
    # test_m16_cierre; m_remediation: test_cloud_writers_simulator). Simula
    # respuestas de httpx. Sólo tests → sólo dev.
    "respx>=0.21",
]

[tool.setuptools.packages.find]
# Empaqueta SOLO `app` (código del backend). Sin esto, setuptools (>=61) aborta
# `pip install -e .` con "Multiple top-level packages in flat-layout"
# (assets/migrations/mcp_servers NO son paquetes a instalar). Los tests importan
# `backend.app` vía PYTHONPATH=repo-root, no por este install (que solo aporta deps).
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# 2026-06-09 · baseline de lint pragmático para una base grande nunca linteada.
# Se ENFORZA el núcleo de pyflakes (bugs reales: imports/variables sin usar,
# nombres indefinidos, f-strings rotas, redefiniciones) + warnings de whitespace.
# Se deja fuera del gate el estilo no aplicado históricamente: E501 (longitud),
# N (convenciones de nombres · requeriría renombrados masivos), I (orden de
# imports · puro estilo, sin valor de corrección). Se podrán ir endureciendo.
select = ["F", "W"]
ignore = [
    "F841",  # unused-variable: muchas son `x = await db.execute(...)` (efecto) · baseline
]

[tool.ruff.lint.per-file-ignores]
# __init__.py reexporta símbolos (no son imports "sin usar").
"**/__init__.py" = ["F401"]
# Migraciones Alembic son artefactos generados · no se lintean a mano.
# (glob relativo al dir del pyproject = backend/)
"migrations/**" = ["F401", "W291", "W292", "W293"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "llm: tests requiring real Anthropic API call",
    "flaky: flaky tests (primarily LLM probabilistic outputs) to rerun via pytest-rerunfailures",
    "real_auth: tests que validan auth real (opt-out del autouse override en tests/conftest.py — sub-fase 4.D ADR-021)",
    "golden: golden dataset regression tests (1.E.1.B.3 · eval_runner harness · pass_rate threshold gates)",
    "requires_db: test que necesita PostgreSQL con el esquema migrado. Se aplica SOLO a mano; los tests que piden el fixture `db` lo reciben automaticamente en tests/conftest.py (pytest_collection_modifyitems), porque son 2.717 y anotarlos uno a uno no se mantendria. Selecciona con `-m requires_db` / excluye con `-m \"not requires_db\"`.",
]
timeout = 300
timeout_method = "thread"

[tool.coverage.run]
concurrency = ["thread", "greenlet"]
source = ["backend/app"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
