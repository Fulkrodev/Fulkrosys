dimensiones_valoracion:
- codigo: D
  nombre: Disponibilidad
  definicion: Propiedad o característica de los activos consistente en que las entidades o procesos autorizados tienen acceso
    a los mismos cuando lo requieren.
  norma: UNE 71504:2008
- codigo: I
  nombre: Integridad
  definicion: Propiedad o característica consistente en que el activo de información no ha sido alterado de manera no autorizada.
  norma: ISO/IEC 13335-1:2004
- codigo: C
  nombre: Confidencialidad
  definicion: Propiedad o característica consistente en que la información ni se pone a disposición, ni se revela a individuos,
    entidades o procesos no autorizados.
  norma: UNE-ISO/IEC 27001:2007
- codigo: A
  nombre: Autenticidad
  definicion: Propiedad o característica consistente en que una entidad es quien dice ser o bien que garantiza la fuente de
    la que proceden los datos.
  norma: UNE 71504:2008
- codigo: T
  nombre: Trazabilidad
  definicion: Propiedad o característica consistente en que las actuaciones de una entidad pueden ser imputadas exclusivamente
    a dicha entidad.
  norma: UNE 71504:2008
