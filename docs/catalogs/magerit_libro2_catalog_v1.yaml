    pasiva del ataque. Prácticamente todos los dispositivos electrónicos emiten radiaciones al exterior que pudieran ser interceptadas
    por otros equipos (receptores de radio) derivándose una fuga de informa­ ción. Esta amenaza se denomina, incorrecta pero
    frecuentemente, ataque TEMPEST (del inglés “Transient Electromagnetic Pulse Standard”). Abusando del significado primigenio,
