version: '1.0'
fecha: '2026-04-13'
fuentes:
  descripciones: >-
    Redacción propia de FULKRO. Cada campo `descripcion` de este catálogo está escrito con
    lenguaje propio; no reproduce el texto de ninguna guía. La referencia normativa de lo que
    exige cada medida es el RD 311/2022, Anexo II (BOE-A-2022-7191). La guía CCN-STIC 804 se
    cita en el campo `fuente_oficial` de cada medida como fuente de consulta, para poder
    localizar la sección correspondiente, no como origen del texto.
  aplicabilidad_y_refuerzos: RD 311/2022 Anexo II - Medidas de seguridad ENS
  codigos_validados_contra: 'RD 311/2022 Anexo II, extraído del PDF del BOE (73 códigos). Ver backend/scripts/extraer_anexo2_boe.py'
notas_importantes:
- 'Cambio 2026-09-10: las 79 descripciones se reescribieron con redacción propia. Antes eran
  extractos literales de la guía CCN-STIC 804 v2017, obtenidos además por extracción automática,
  y arrastraban su ruido (encabezados de sección, notas al pie y referencias sueltas incrustadas
  en mitad del texto). Se reescriben por dos motivos: este repositorio es público y no procede
  redistribuir texto ajeno, y el texto extraído era de mala calidad para mostrarlo en la interfaz.'
- 'Trazabilidad: no se pierde. `fuente_oficial` sigue apuntando a la sección concreta de la guía
  de cada medida, y `codigo`, `nombre`, aplicabilidad por categoría, `dimensiones_aplicables` y
  `refuerzos` no se tocaron en ese cambio.'
- 'Guardia: scripts/verificar_catalogo_sin_copia_literal.py compara contra la versión anterior en
  git y falla si alguna descripción comparte 8 o más palabras consecutivas con la original o si
  cambió algún campo distinto de `descripcion`. El test permanente
  backend/tests/scripts/test_catalogo_sin_copia_literal.py comprueba que no reaparecen los
  marcadores de la extracción (encabezados tipo "3.1 [ORG.1]").'
- 'Cambio 2026-09-11 (bloque N2): se ELIMINARON del catálogo 6 códigos que no existen en el
  Anexo II del RD 311/2022 (op.exp.11, mp.com.9, mp.if.9, mp.per.9, mp.s.8, mp.s.9). Venían de
  CCN-STIC 804 v2017, que está basado en el RD 3/2010 (versión derogada del ENS). Antes seguían
  aquí y el sembrador los filtraba con una lista negra: la fuente declaraba 79 y los consumidores
  parcheaban. Ahora la fuente declara 73, que es lo que dice la norma, y la lista negra se quitó.
  Contrastado contra el PDF del BOE: backend/tests/fixtures/anexo2_boe_verificado.json.'

- Aplicabilidad por categoría y refuerzos están actualizados al RD 311/2022 Anexo II.
medidas_count: 73
medidas:
- codigo: org.1
  nombre: Política De Seguridad
  marco: org
  familia: org
  familia_nombre: Marco organizativo
  descripcion: >-
    Exige aprobar y mantener vigente un documento rector, de alcance corporativo, en el que la dirección fija qué
    entiende por proteger la información y quién responde de ello. Debe asignar roles y responsabilidades con nombre y
    ámbito, y resultar de obligado cumplimiento para toda la organización. Se redacta en términos comprensibles y sin
    detalle técnico, que se remite a la normativa y a los procedimientos que cuelgan de ella.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 3.1
- codigo: org.2
  nombre: Normativa De Seguridad
  marco: org
  familia: org
  familia_nombre: Marco organizativo
  descripcion: >-
    Reúne las reglas de uso que traducen la política a criterios concretos por materia o por servicio. Fija qué está
    permitido, qué está prohibido y a quién corresponde decidir cuando el caso no encaja en ningún procedimiento
    previsto. Sirve así de referencia estable ante situaciones no contempladas o instrucciones que se contradicen entre
    sí.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 3.2
- codigo: org.3
  nombre: Procedimientos Operativos De Seguridad
  marco: org
  familia: org
  familia_nombre: Marco organizativo
  descripcion: >-
    Documenta, paso a paso, cómo se ejecutan las tareas con repercusión en la seguridad. Su finalidad es que la
    operación no dependa del conocimiento personal de nadie: cualquier persona con la formación adecuada debe poder
    relevar a otra siguiendo lo escrito. Han de estar difundidos entre quienes los aplican y revisarse cuando cambie la
    actividad que describen.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 3.3
- codigo: org.4
  nombre: Proceso De Autorización
  marco: org
  familia: org
  familia_nombre: Marco organizativo
  descripcion: >-
    Somete a aprobación previa la incorporación de cualquier elemento al sistema: equipos, aplicaciones, soportes,
    locales, servicios contratados y vías de acceso remoto. El objetivo es que nada entre en producción sin que un
    responsable identificado haya valorado el riesgo que añade y la superficie de exposición que abre. La regla rige
    durante todo el ciclo de vida del componente, no sólo en el alta inicial.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 3.4
- codigo: op.acc.1
  nombre: Identificación
  marco: op
  familia: op.acc
  familia_nombre: Control de acceso
  descripcion: >-
    Cada usuario, proceso o servicio que accede al sistema recibe un identificador único, que ni se comparte ni se
    reutiliza para otra entidad. Sin esa singularidad no se puede saber quién posee cada permiso ni atribuir después una
    actuación concreta a nadie. Las cuentas se inhabilitan o se dan de baja cuando su titular deja de necesitarlas.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - I
  - C
  - A
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 4.2.1
- codigo: op.acc.2
  nombre: Requisitos De Acceso
  marco: op
  familia: op.acc
  familia_nombre: Control de acceso
  descripcion: >-
    Los recursos del sistema quedan detrás de un control que sólo deja pasar a quien esté autorizado, tanto en
    producción como en los entornos previos a ella. Exige dejar por escrito la correspondencia entre recursos y
    permisos, de forma que la autorización sea comprobable y no dependa de la configuración heredada. Los derechos los
    concede el responsable de la información, no quien administra la máquina.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - I
  - C
  - A
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 4.2.2
- codigo: op.acc.3
  nombre: Segregación De Funciones Y Tareas
  marco: op
  familia: op.acc
  familia_nombre: Control de acceso
  descripcion: >-
    Reparte entre personas distintas aquellas funciones cuya acumulación permitiría cometer o encubrir un abuso, de modo
    que las actividades críticas exijan la intervención de al menos dos. Persigue dos fines: reducir el error y evitar
    que un privilegio se ejerza sin contrapeso. Debe existir un esquema documentado de incompatibilidades y un
    procedimiento de asignación que lo respete.
  aplica_basica: false
  aplica_media: true
  aplica_alta: true
  categoria_minima: MEDIA
  dimensiones_aplicables:
  - I
