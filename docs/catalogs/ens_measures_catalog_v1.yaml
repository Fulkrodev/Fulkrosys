  marco: op
  familia: op.cont
  familia_nombre: Continuidad del servicio
  descripcion: >-
    Somete el plan de continuidad a ejercicios regulares, para comprobar que funciona antes de necesitarlo de verdad.
    Las pruebas pueden ser parciales, pero en conjunto han de cubrir todas las actuaciones previstas e involucrar a
    quienes tendrían que ejecutarlas. Los fallos que se detecten se corrigen y el plan se actualiza en consecuencia.
  aplica_basica: false
  aplica_media: false
  aplica_alta: true
  categoria_minima: ALTA
  dimensiones_aplicables:
  - D
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 4.5.3
