- codigo: op.mon.3
  nombre: Vigilancia
  marco: op
  familia: op.mon
  familia_nombre: Monitorización del sistema
  descripcion: >-
    Mantiene una supervisión continuada del sistema orientada a advertir comportamientos anómalos que puedan anticipar
    un incidente. Combina la observación de los indicadores propios con la información sobre amenazas que llega del
    exterior. La capacidad de reacción asociada debe guardar proporción con el nivel de amenaza y con la categoría del
    sistema.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: RD 311/2022 Anexo II (medida nueva)
- codigo: op.nub.1
  nombre: Protección de servicios en la nube
  marco: op
  familia: op.nub
  familia_nombre: Servicios en la nube
  descripcion: >-
    Cuando parte del sistema descansa en servicios en la nube, hay que evaluar los riesgos propios de ese modelo y
    delimitar qué protege el proveedor y qué sigue correspondiendo a la organización. Esa frontera se documenta y se
    lleva al contrato, junto con las exigencias sobre ubicación de los datos, cifrado, registro de actividad y
    recuperación. El nivel de seguridad exigible es el que marca la categoría del sistema, con independencia de dónde se
    ejecute.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: RD 311/2022 Anexo II (medida nueva)
- codigo: op.pl.1
  nombre: Análisis De Riesgos
  marco: op
  familia: op.pl
  familia_nombre: Planificación
  descripcion: >-
    Obliga a identificar los activos, las amenazas que les afectan y el riesgo resultante, para decidir con criterio qué
    salvaguardas se implantan y cuáles se sustituyen por alternativas. El resultado justifica el conjunto de medidas
    elegido y señala dónde faltan. Es una tarea recurrente: se repite cuando cambian el sistema, el servicio prestado o
    el entorno de amenaza.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
