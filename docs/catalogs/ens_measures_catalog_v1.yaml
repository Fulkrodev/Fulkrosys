- codigo: mp.com.1
  nombre: Perímetro Seguro
  marco: mp
  familia: mp.com
  familia_nombre: Protección de las comunicaciones
  descripcion: >-
    Obliga a delimitar por dónde se conecta el sistema con el exterior y a reflejarlo en la documentación de
    arquitectura. Ese límite se protege con cortafuegos por los que pasa todo el tráfico y que sólo dejan circular los
    flujos autorizados de antemano. En los niveles más exigentes se emplean equipos de distinto fabricante dispuestos en
    cascada, para que un mismo defecto no franquee las dos barreras.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.4.1
- codigo: mp.com.2
  nombre: Protección De La Confidencialidad
  marco: mp
  familia: mp.com
  familia_nombre: Protección de las comunicaciones
  descripcion: >-
    Impide que la información transmitida pueda ser leída por terceros, empleando cifrado con algoritmos y longitudes de
    clave acreditados. Cuando el canal sale del ámbito que la organización controla, se recurre a cifrado extremo a
    extremo, por ejemplo mediante una red privada virtual establecida tras autenticar al otro lado. Suele implantarse a
    la vez que la protección de la autenticidad y la integridad, porque comparten la negociación de claves.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - C
  refuerzos:
