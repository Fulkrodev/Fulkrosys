- codigo: mp.com.4
  nombre: Segregación De Redes
  marco: mp
  familia: mp.com
  familia_nombre: Protección de las comunicaciones
  descripcion: >-
    Divide la red en segmentos con control de entrada, de modo que cada uno agrupe recursos con necesidades de
    protección semejantes. Se acota así a qué puede llegar cada quien y se limita la propagación de un incidente al
    ámbito donde se produjo. La segmentación debe figurar en la documentación de arquitectura del sistema.
  aplica_basica: false
  aplica_media: true
  aplica_alta: true
  categoria_minima: MEDIA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.4.4
- codigo: mp.eq.1
  nombre: Puesto De Trabajo Despejado
  marco: mp
  familia: mp.eq
  familia_nombre: Protección de los equipos
  descripcion: >-
    Exige que sobre la mesa no quede más material del que la tarea en curso requiere. Al terminar, la documentación y
    los soportes vuelven a un armario o cajón que se cierra bajo llave, al menos cuando la jornada acaba. Reduce la
    exposición de información ante quien pase por la zona y las pérdidas por simple descuido.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - C
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.3.1
- codigo: mp.eq.2
  nombre: Bloqueo De Puesto De Trabajo
  marco: mp
  familia: mp.eq
  familia_nombre: Protección de los equipos
  descripcion: >-
    El equipo se bloquea por sí solo tras un periodo de inactividad fijado por la organización, y reanudar el trabajo
    exige autenticarse de nuevo. Ese plazo forma parte de la configuración y la persona usuaria no puede alterarlo.
    Pasado un tiempo mayor, las sesiones abiertas se cierran, tanto las locales como las remotas.
  aplica_basica: false
  aplica_media: true
  aplica_alta: true
  categoria_minima: MEDIA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.3.2
- codigo: mp.eq.3
  nombre: Protección De Equipos Portátiles
  marco: mp
  familia: mp.eq
  familia_nombre: Protección de los equipos
  descripcion: >-
    Los dispositivos que salen de las instalaciones se inventarían junto a la persona responsable de cada uno, y se
    comprueba con regularidad que siguen bajo su control. Deben llevar cifrada la información que albergan y disponer de
    un mecanismo que permita bloquearlos o borrarlos si se pierden o los sustraen. Conviene que cuenten con protección
    perimetral propia que sólo admita las conexiones autorizadas, y debe existir una vía para comunicar el extravío sin
    demora.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - C
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.3.3
- codigo: mp.eq.4
  nombre: Otros dispositivos conectados a la red
  marco: mp
  familia: mp.eq
  familia_nombre: Protección de los equipos
  descripcion: >-
    Alcanza a los equipos que no son puestos de trabajo estándar pero comparten la red: impresoras, dispositivos
    móviles, sistemas de control, cámaras o equipamiento del llamado internet de las cosas. Han de estar inventariados,
    con las credenciales de fábrica sustituidas y su exposición reducida a lo que necesiten para funcionar. Cuando no
    admitan los mismos controles que el resto, se aíslan en segmentos separados.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - D
  refuerzos: {}
  fuente_oficial: RD 311/2022 Anexo II (medida nueva)
- codigo: mp.if.1
  nombre: Áreas Separadas Y Con Control De Acceso
  marco: mp
  familia: mp.if
  familia_nombre: Protección de las instalaciones e infraestructuras
  descripcion: >-
    Delimita las zonas donde hay equipamiento o se maneja información protegida y restringe la entrada a quien esté
    autorizado. Debe existir un inventario de esas áreas con su función y su responsable, y control de los medios de
    apertura: si son llaves o dispositivos equivalentes, se anota quién los tiene y se reponen sin demora ante una
    pérdida. El nivel de protección se ajusta a lo que se guarda dentro.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.1.1
- codigo: mp.if.2
  nombre: Identificación De Las Personas
  marco: mp
  familia: mp.if
  familia_nombre: Protección de las instalaciones e infraestructuras
  descripcion: >-
    En las áreas de acceso restringido se mantiene la relación de personas autorizadas y un sistema que verifique
    identidad y autorización en cada entrada. Queda constancia de entradas y salidas, con identificación de la persona y
    marca de tiempo. La relación de autorizados se revisa con periodicidad y se depura cuando alguien deja de necesitar
    el acceso.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.1.2
- codigo: mp.if.3
  nombre: Acondicionamiento De Los Locales
  marco: mp
  familia: mp.if
  familia_nombre: Protección de las instalaciones e infraestructuras
  descripcion: >-
    Los locales que alojan equipamiento deben reunir condiciones apropiadas para su funcionamiento: temperatura y
    humedad dentro del margen que indique el fabricante, cableado ordenado y protección frente a las amenazas del
    entorno recogidas en el análisis de riesgos. Se atiende tanto a los riesgos de origen natural como a los que
    provienen de las actividades vecinas.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.1.3
- codigo: mp.if.4
  nombre: Energía Eléctrica
  marco: mp
  familia: mp.if
  familia_nombre: Protección de las instalaciones e infraestructuras
  descripcion: >-
    Garantiza que los equipos cuentan con suministro eléctrico suficiente y estable, y que un corte no acarrea pérdida
    de información. Se dimensionan y protegen el cableado y los cuadros de potencia, y se prevén fuentes de respaldo
    capaces de sostener el servicio o, al menos, de permitir un apagado ordenado. Comprende también el alumbrado de
    emergencia y su comprobación periódica.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - D
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.1.4
- codigo: mp.if.5
  nombre: Protección Frente A Incendios
  marco: mp
  familia: mp.if
  familia_nombre: Protección de las instalaciones e infraestructuras
  descripcion: >-
    Exige valorar el riesgo de incendio, tanto por el entorno como por las instalaciones propias, y desplegar medidas de
    prevención, detección y extinción proporcionadas. Se evitan materiales inflamables, se compartimenta el local y la
    detección se conecta a un servicio de alarma permanente. Han de respetarse además las obligaciones de la normativa
    sectorial de protección contra incendios.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.1.5
- codigo: mp.if.6
  nombre: Protección Frente A Inundaciones
  marco: mp
  familia: mp.if
  familia_nombre: Protección de las instalaciones e infraestructuras
  descripcion: >-
    Requiere estudiar la exposición del local al agua, por su ubicación o por las canalizaciones que lo atraviesan, y
    actuar en consecuencia. Entre las medidas habituales figuran el aislamiento frente a humedades, el desagüe con
    limpieza programada y la detección conectada a un servicio de alarma. Debe existir asimismo un plan de reacción y
    recuperación para el caso de que llegue a ocurrir.
  aplica_basica: false
  aplica_media: true
  aplica_alta: true
  categoria_minima: MEDIA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.1.6
- codigo: mp.if.7
  nombre: Registro De Entrada Y Salida De Equipamiento
  marco: mp
  familia: mp.if
  familia_nombre: Protección de las instalaciones e infraestructuras
  descripcion: >-
    Toda entrada o salida de equipamiento del local queda anotada, con fecha y hora, identificación inequívoca del
    elemento y las personas que lo mueven, lo autorizan y lo registran. El registro permite saber en cada momento qué
    hay dentro y determinar responsabilidades si algo desaparece. Es recomendable que quien solicita el movimiento y
    quien lo autoriza sean personas distintas.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.1.7
- codigo: mp.info.1
  nombre: Datos De Carácter Personal
  marco: mp
  familia: mp.info
  familia_nombre: Protección de la información
  descripcion: >-
    Cuando el sistema trata datos personales es obligado cumplir la normativa de protección de datos vigente, que se
    aplica junto a las exigencias del Esquema Nacional de Seguridad y no en lugar de ellas. Hay que saber qué datos se
    tratan, con qué base jurídica y durante cuánto tiempo, y aplicar las medidas que correspondan al riesgo para los
    derechos de las personas afectadas. La referencia es el Reglamento (UE) 2016/679 y la legislación española que lo
    desarrolla.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - C
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.7.1
- codigo: mp.info.2
  nombre: Calificación De La Información
  marco: mp
  familia: mp.info
  familia_nombre: Protección de la información
  descripcion: >-
    Establece un esquema para asignar a cada información un nivel según su necesidad de confidencialidad, y designa
    quién puede asignarlo y quién puede modificarlo. Ese esquema debe encajar con el que rige en el entorno de la
    organización y con los criterios de categorización del propio Esquema Nacional de Seguridad. De la calificación se
    derivan las reglas de uso, copia, difusión y destrucción aplicables.
  aplica_basica: false
  aplica_media: true
  aplica_alta: true
  categoria_minima: MEDIA
  dimensiones_aplicables:
  - C
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.7.2
- codigo: mp.info.3
  nombre: Firma Electrónica
  marco: mp
  familia: mp.info
  familia_nombre: Protección de la información
  descripcion: >-
    Cuando se firman documentos por medios electrónicos, las condiciones de uso se recogen en un marco técnico y
    procedimental aprobado formalmente, conocido habitualmente como política de firma. Ese marco fija qué certificados y
    formatos se admiten, cómo se verifica una firma y qué se conserva para poder comprobarla más adelante. Si se emplean
    otros mecanismos admitidos en derecho, han de acompañarse de garantías equivalentes frente al repudio.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - I
  - A
  refuerzos:
    A:
    - R1
    - R2
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.7.4 · código RD 311/2022 Anexo II = mp.info.3 (Firma electrónica)
- codigo: mp.info.4
  nombre: Sellos De Tiempo
  marco: mp
  familia: mp.info
  familia_nombre: Protección de la información
  descripcion: >-
    Acreditan el momento en que existió un documento, de manera que después no pueda negarse su fecha. Se aplican a la
    información llamada a servir como prueba o que deba conservar capacidad probatoria, y se rigen por el mismo marco
    formal que la firma electrónica. Hay que fijar cuánto tiempo se conserva la información fechada y verificar que los
    sellos siguen siendo comprobables durante ese plazo.
  aplica_basica: false
  aplica_media: false
  aplica_alta: true
  categoria_minima: ALTA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.7.5 · código RD 311/2022 Anexo II = mp.info.4 (Sellos de tiempo)
- codigo: mp.info.5
  nombre: Limpieza De Documentos
  marco: mp
  familia: mp.info
  familia_nombre: Protección de la información
  descripcion: >-
    Antes de entregar un documento fuera del dominio de seguridad se le retira la información accesoria que arrastra sin
    verse: metadatos, campos ocultos, comentarios y versiones anteriores. Importa en especial cuando el documento se
    difunde de forma amplia, por ejemplo al publicarlo en un sitio web. Omitir este paso puede revelar datos
    confidenciales o personales sin que nadie lo advierta.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - C
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.7.6 · código RD 311/2022 Anexo II = mp.info.5 (Limpieza de documentos)
- codigo: mp.info.6
  nombre: Copias De Seguridad
  marco: mp
  familia: mp.info
  familia_nombre: Protección de la información
  descripcion: >-
    Exige respaldar la información y el software necesarios para recuperar el servicio, con la frecuencia y la
    antigüedad que fije la organización. Las copias reciben el mismo nivel de protección que los datos originales,
    cifrado incluido cuando la confidencialidad lo requiera, y se guardan de modo que un mismo suceso no destruya a la
    vez el original y su respaldo. La restauración se prueba de forma periódica: una copia que nunca se ha restaurado no
    está comprobada.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - D
  refuerzos:
    A:
    - R1
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.7.7 · código RD 311/2022 Anexo II = mp.info.6 (Copias de seguridad)
- codigo: mp.per.1
  nombre: Caracterización Del Puesto De Trabajo
  marco: mp
  familia: mp.per
  familia_nombre: Gestión del personal
  descripcion: >-
    Define, para cada puesto, qué responsabilidades de seguridad conlleva y qué requisitos debe reunir quien lo ocupe,
    partiendo del riesgo asociado a sus funciones. Esos requisitos se comprueban durante la selección, con las
    verificaciones que resulten pertinentes y proporcionadas. La caracterización se revisa cuando el puesto cambia de
    contenido.
  aplica_basica: false
  aplica_media: true
  aplica_alta: true
  categoria_minima: MEDIA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.2.1
- codigo: mp.per.2
  nombre: Deberes Y Obligaciones
  marco: mp
  familia: mp.per
  familia_nombre: Gestión del personal
  descripcion: >-
    Cada persona relacionada con el sistema debe conocer por escrito qué se espera de ella en materia de seguridad y qué
    consecuencias acarrea incumplirlo. Se cubre tanto el tiempo en el puesto como las obligaciones que perduran al cesar
    o al cambiar de destino, con atención particular al deber de confidencialidad. Alcanza también al personal de
    terceros que opere sobre el sistema.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.2.2
- codigo: mp.per.3
  nombre: Concienciación
  marco: mp
  familia: mp.per
  familia_nombre: Gestión del personal
  descripcion: >-
    Recuerda al personal, con regularidad, cómo debe usar los sistemas, qué señales apuntan a un posible incidente y por
    dónde comunicarlo. No busca formar técnicamente, sino sostener la atención a lo largo del tiempo, porque muchos
    incidentes empiezan en un descuido cotidiano. De las acciones realizadas queda constancia documental.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.2.3
- codigo: mp.per.4
  nombre: Formación
  marco: mp
  familia: mp.per
  familia_nombre: Gestión del personal
  descripcion: >-
    Proporciona a cada persona la capacitación técnica que su cometido requiere: configuración de los sistemas que
    maneja, detección y respuesta ante incidentes, y tratamiento correcto de la información que custodia. Se actualiza
    cuando cambian los componentes, las herramientas o los procedimientos. Debe quedar registro de quién la ha recibido
    y cuándo.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.2.4
- codigo: mp.s.1
  nombre: Protección Del Correo Electrónico (E-Mail)
  marco: mp
  familia: mp.s
  familia_nombre: Protección de los servicios
  descripcion: >-
    Protege el servicio de correo frente a los riesgos característicos de este canal: contenido dañino en el cuerpo o en
    los adjuntos, mensajes no solicitados y suplantación del remitente. Comprende asegurar el encaminamiento de los
    mensajes y el establecimiento de las conexiones, impidiendo que las personas usuarias recurran a servidores ajenos
    al corporativo. Se completa con reglas de uso conocidas por el personal.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.8.1
- codigo: mp.s.2
  nombre: Protección De Servicios Y Aplicaciones Web
  marco: mp
  familia: mp.s
  familia_nombre: Protección de los servicios
  descripcion: >-
    Protege los servicios publicados frente a los ataques característicos de la web, como la manipulación de las
    entradas, la inyección de código o el secuestro de sesión. Buena parte del esfuerzo es preventivo y recae en el
    desarrollo, la configuración segura y el mantenimiento al día de los componentes. Cuando el servicio admite datos de
    quien lo usa, se validan antes de tratarlos y se registran los intentos anómalos.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.8.2
- codigo: mp.s.3
  nombre: Protección de la navegación web
  marco: mp
  familia: mp.s
  familia_nombre: Protección de los servicios
  descripcion: >-
    Protege a quien navega desde el sistema frente a lo que llega por el navegador: sitios maliciosos, descargas dañinas
    y código que intenta aprovechar un fallo del cliente. Se apoya en el filtrado de contenidos, el bloqueo de destinos
    desaconsejados y el mantenimiento actualizado de navegadores y complementos. Los avisos que genera se tratan dentro
    del proceso de incidentes.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: RD 311/2022 Anexo II (medida nueva)
- codigo: mp.s.4
  nombre: Protección frente a denegación de servicio
  marco: mp
  familia: mp.s
  familia_nombre: Protección de los servicios
  descripcion: >-
    Prepara el sistema para resistir intentos de dejarlo fuera de servicio por saturación. Combina el dimensionado
    holgado de los elementos expuestos, la detección temprana del ataque y la capacidad de mitigar o desviar el tráfico,
    a menudo en colaboración con el proveedor de conectividad. Debe estar previsto a quién se avisa y cómo se opera
    mientras el ataque dura.
  aplica_basica: false
  aplica_media: true
  aplica_alta: true
  categoria_minima: MEDIA
  dimensiones_aplicables:
  - D
  refuerzos: {}
  fuente_oficial: RD 311/2022 Anexo II
- codigo: mp.si.1
  nombre: Etiquetado
  marco: mp
  familia: mp.si
  familia_nombre: Protección de los soportes de información
  descripcion: >-
    Los soportes se marcan de manera que se reconozca el nivel de calificación más alto de cuanto contienen, sin
    desvelar la información en sí. La marca puede ir en el propio soporte o resolverse con un código que remita a un
    registro consultable por la persona usuaria. De esa marca dependen las normas y los procedimientos de manejo que le
    corresponden.
  aplica_basica: false
  aplica_media: true
  aplica_alta: true
  categoria_minima: MEDIA
  dimensiones_aplicables:
  - C
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.5.1
- codigo: mp.si.2
  nombre: Criptografía
  marco: mp
  familia: mp.si
  familia_nombre: Protección de los soportes de información
  descripcion: >-
    Exige cifrar la información almacenada en soportes, en particular los extraíbles, para que su pérdida o sustracción
    no se convierta en una fuga. Puede protegerse el dato antes de copiarlo, cifrarse un volumen completo o emplearse
    soportes con cifrado incorporado por hardware. La gestión de las claves empleadas se somete a la medida específica
    de protección de claves criptográficas.
  aplica_basica: false
  aplica_media: true
  aplica_alta: true
  categoria_minima: MEDIA
  dimensiones_aplicables:
  - C
  - I
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.5.2
- codigo: mp.si.3
  nombre: Custodia
  marco: mp
  familia: mp.si
  familia_nombre: Protección de los soportes de información
  descripcion: >-
    Los soportes bajo responsabilidad de la organización se guardan con la diligencia que corresponde a lo que
    contienen, controlando el acceso por medios físicos, lógicos o ambos. Se respetan además las condiciones de
    conservación que indique el fabricante, en especial de temperatura y humedad. Conviene mantener el historial de cada
    soporte desde su primer uso hasta su retirada.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.5.3
- codigo: mp.si.4
  nombre: Transporte
  marco: mp
  familia: mp.si
  familia_nombre: Protección de los soportes de información
  descripcion: >-
    Cuando un soporte se desplaza, ha de seguir protegido y bajo control durante todo el trayecto. Se lleva registro de
    salida y de entrada, identificando el soporte y a quien lo transporta, y un procedimiento rutinario coteja lo
    enviado con lo recibido y da la alarma cuando algo no cuadra. Quien transporta debe conocer sus obligaciones y dejar
    constancia de la entrega.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.5.4
- codigo: mp.si.5
  nombre: Borrado Y Destrucción
  marco: mp
  familia: mp.si
  familia_nombre: Protección de los soportes de información
  descripcion: >-
    Antes de reutilizar un soporte para otra información o de cederlo fuera, se le aplica un borrado seguro
    proporcionado a la calificación de lo que contuvo. Si el soporte no admite un borrado fiable, o si el nivel de
    calificación así lo exige, se destruye por un método acorde. La operación queda documentada.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - C
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.5.5
- codigo: mp.sw.1
  nombre: Desarrollo
  marco: mp
  familia: mp.sw
  familia_nombre: Protección de las aplicaciones informáticas
  descripcion: >-
    El desarrollo se lleva a cabo en un entorno separado del de producción, sin que existan en producción herramientas
    ni datos de desarrollo. La metodología empleada debe incorporar la seguridad desde el principio y no como añadido
    final, tratando los requisitos de seguridad igual que los funcionales. Para las pruebas no se emplean datos reales;
    si no hay alternativa, se protegen al nivel que les corresponda.
  aplica_basica: false
  aplica_media: true
  aplica_alta: true
  categoria_minima: MEDIA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.6.1
- codigo: mp.sw.2
  nombre: Aceptación Y Puesta En Servicio
  marco: mp
  familia: mp.sw
  familia_nombre: Protección de las aplicaciones informáticas
  descripcion: >-
    Antes de poner un programa en explotación se comprueba que satisface los requisitos de seguridad exigidos, que
    registra los fallos y las sospechas de violación, y que están listos los procedimientos para gestionarlos. Las
    pruebas se realizan en un entorno separado, para no alterar datos ni abrir brechas en producción. El resultado se
    documenta y la puesta en servicio la aprueba el responsable.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.6.2
