- codigo: op.mon.1
  nombre: Detección De Intrusión
  marco: op
  familia: op.mon
  familia_nombre: Monitorización del sistema
  descripcion: >-
    Despliega mecanismos que adviertan intentos de intrusión y actividad hostil, observando el tráfico de la red o las
    trazas de los equipos. Su valor está en avisar a tiempo para poder reaccionar y en reunir información que permita
    analizar después lo ocurrido. Exige organizar la recogida de datos desde los puntos donde se generan y atender de
    forma efectiva los avisos que produce.
