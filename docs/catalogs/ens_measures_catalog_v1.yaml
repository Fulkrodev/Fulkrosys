    - R2
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 5.4.2
- codigo: mp.com.3
  nombre: Protección De La Autenticidad Y De La Integridad
  marco: mp
  familia: mp.com
  familia_nombre: Protección de las comunicaciones
  descripcion: >-
    Antes de intercambiar información hay que acreditar de manera fehaciente con quién se está hablando, y garantizar
    después que lo transmitido no se altera por el camino. Se emplean protocolos y mecanismos recogidos en la normativa
    de la organización, descartando los desaconsejados u obsoletos. Toda alteración detectada debe provocar el rechazo
    de los datos y quedar registrada.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
