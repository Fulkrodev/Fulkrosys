  marco: op
  familia: op.cont
  familia_nombre: Continuidad del servicio
  descripcion: >-
    Recoge por escrito quién hace qué si una interrupción grave impide prestar el servicio con los medios habituales.
    Debe designar a quien decide activarlo, a quien comunica con los afectados y a quien se ocupa de reponer los medios,
    y contemplar los escenarios identificados. Ha de estar accesible incluso cuando el sistema principal no lo esté.
  aplica_basica: false
  aplica_media: false
  aplica_alta: true
  categoria_minima: ALTA
  dimensiones_aplicables:
