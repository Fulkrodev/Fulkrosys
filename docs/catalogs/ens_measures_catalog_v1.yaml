  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 4.2.3
- codigo: op.acc.4
  nombre: Proceso De Gestión De Derechos De Acceso
  marco: op
  familia: op.acc
  familia_nombre: Control de acceso
  descripcion: >-
    Los permisos se otorgan en función de lo que cada persona necesita para su cometido y se limitan a lo mínimo
    imprescindible. La concesión nace de una solicitud del responsable de la información afectada y se revisa con
    periodicidad: si la necesidad ya no se sostiene, el derecho se retira. Merecen vigilancia reforzada las cuentas con
    privilegios de administración.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - I
  - C
  - A
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 4.2.4
