- codigo: op.cont.1
  nombre: Análisis De Impacto
  marco: op
  familia: op.cont
  familia_nombre: Continuidad del servicio
  descripcion: >-
    Determina qué servicios no pueden dejar de prestarse, cuánto tiempo resisten interrumpidos y qué elementos del
    sistema hacen falta para sostenerlos. De ahí salen los plazos máximos de recuperación y el volumen de información
    cuya pérdida se puede asumir. Es el punto de partida del plan de continuidad: sin este estudio, los medios de
    reserva se dimensionan a ciegas.
  aplica_basica: false
  aplica_media: true
  aplica_alta: true
  categoria_minima: MEDIA
  dimensiones_aplicables:
