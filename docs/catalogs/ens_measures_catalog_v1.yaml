- codigo: op.acc.6
  nombre: Acceso Local (Local Logon)
  marco: op
  familia: op.acc
  familia_nombre: Control de acceso
  descripcion: >-
    Regula el acceso desde los puestos de la propia organización: intentos fallidos tolerados, registro de los mismos,
    horario en que se permite trabajar e información que se muestra antes de autenticar. Conviene revelar lo mínimo
    sobre el sistema mientras no se haya validado la identidad, para no orientar a quien intente entrar sin permiso. Una
    vez dentro, se informa a la persona de su conexión anterior y de los intentos fallidos, de modo que pueda advertir
