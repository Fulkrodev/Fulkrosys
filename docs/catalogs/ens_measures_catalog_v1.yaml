  nombre: Gestión Diaria
  marco: op
  familia: op.ext
  familia_nombre: Servicios externos
  descripcion: >-
    Establece el seguimiento ordinario del servicio prestado por el tercero mediante indicadores y umbrales acordados.
    Cuando un indicador se sale de rango salta un aviso que activa la resolución y el escalado previstos, tratándose el
    caso como una incidencia más. Las desviaciones se documentan y se revisan periódicamente con el proveedor.
