- codigo: op.pl.2
  nombre: Arquitectura De Seguridad
  marco: op
  familia: op.pl
  familia_nombre: Planificación
  descripcion: >-
    Exige mantener una descripción documental del sistema entendido como un todo: sus componentes, sus zonas, las líneas
    de defensa y la forma en que se gestiona y se supervisa. Aporta la visión de conjunto que ninguna medida aislada
    proporciona, y sirve de referencia al análisis de riesgos y a los cambios posteriores. Su elaboración la dirige el
    responsable del sistema y corresponde al responsable de seguridad aprobarla.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - T
  refuerzos:
    A:
    - R1
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 4.1.2
- codigo: op.pl.3
  nombre: Adquisición De Nuevos Componentes
  marco: op
  familia: op.pl
  familia_nombre: Planificación
  descripcion: >-
    Regula la compra o incorporación de componentes para que responda al riesgo evaluado y encaje en la arquitectura
    definida. Antes de adquirir hay que prever el coste completo: puesta en marcha, sostenimiento durante la vida útil y
    relevo cuando la tecnología quede obsoleta. Incluye anticipar la capacitación de quienes vayan a operar el
    componente.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - T
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 4.1.3
- codigo: op.pl.4
  nombre: Dimensionamiento / Gestión De Capacidades
  marco: op
  familia: op.pl
  familia_nombre: Planificación
  descripcion: >-
    Requiere estimar por adelantado las necesidades de proceso, almacenamiento, comunicaciones y personal, de modo que
    el sistema soporte la demanda prevista sin degradarse. Tiene alcance presupuestario, así que esas necesidades han de
    recogerse en la planificación económica y no resolverse sobre la marcha. En entornos elásticos el dimensionado puede
    ajustarse de forma dinámica a la carga real.
  aplica_basica: true
  aplica_media: true
  aplica_alta: true
  categoria_minima: BASICA
  dimensiones_aplicables:
  - D
  refuerzos: {}
  fuente_oficial: CCN-STIC 804 v2017 (junio) - sección 4.1.4
- codigo: op.pl.5
  nombre: Componentes Certificados
  marco: op
  familia: op.pl
  familia_nombre: Planificación
  descripcion: >-
    Da preferencia a productos evaluados y certificados por un tercero competente frente a desarrollos propios o
    soluciones sin acreditación. La razón es práctica: sostener por cuenta propia el nivel de seguridad de un componente
    exige una capacidad de análisis y corrección continua que pocas organizaciones mantienen. La certificación invocada
    debe cubrir precisamente la función de seguridad que se espera del producto.
  aplica_basica: false
  aplica_media: true
  aplica_alta: true
  categoria_minima: MEDIA
  dimensiones_aplicables:
  - T
  refuerzos: {}
