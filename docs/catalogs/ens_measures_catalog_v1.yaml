  nombre: Mecanismo De Autenticación
  marco: op
  familia: op.acc
  familia_nombre: Control de acceso
  descripcion: >-
    Comprueba que quien presenta un identificador es realmente su titular, antes de concederle acceso. Los mecanismos se
    apoyan en algo que se sabe, algo que se posee o algo que se es, y se combinan entre sí cuando el riesgo lo
    justifica. La robustez exigida crece con la categoría del sistema y con la exposición del canal; las credenciales se
