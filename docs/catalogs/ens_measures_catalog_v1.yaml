- codigo: op.ext.3
  nombre: Protección de la cadena de suministro
  marco: op
  familia: op.ext
  familia_nombre: Servicios externos
  descripcion: >-
    Extiende la exigencia de seguridad a los proveedores y a los productos que llegan por medio de ellos,
    subcontratistas incluidos. Hay que conocer de quién depende cada elemento relevante del sistema y qué garantías
    ofrece, y trasladarle por contrato los requisitos que correspondan. Se busca que un eslabón débil aguas arriba no
    rebaje el nivel de seguridad exigido al conjunto.
  aplica_basica: false
  aplica_media: false
