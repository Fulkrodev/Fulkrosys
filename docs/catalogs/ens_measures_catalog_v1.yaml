  refuerzos: {}
  fuente_oficial: RD 311/2022 Anexo II (medida nueva)
- codigo: op.ext.4
  nombre: Interconexión de sistemas
  marco: op
  familia: op.ext
  familia_nombre: Servicios externos
  descripcion: >-
    Antes de enlazar el sistema con otro ajeno se analiza qué riesgo introduce esa unión y se acuerdan las condiciones
    bajo las que opera. La conexión se protege con los controles adecuados y queda documentada, con un responsable
    identificado a cada lado. Se vigila mientras esté activa y se desmonta en cuanto deje de ser necesaria.
  aplica_basica: false
  aplica_media: false
  aplica_alta: true
  categoria_minima: ALTA
  dimensiones_aplicables:
  - T
