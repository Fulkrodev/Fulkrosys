- codigo: op.mon.2
  nombre: Sistema De Métricas
  marco: op
  familia: op.mon
  familia_nombre: Monitorización del sistema
  descripcion: >-
    Recoge de forma sistemática datos sobre el estado de la seguridad para poder dirigirla con criterio: incidentes
    registrados, tiempo de respuesta, grado de implantación de las medidas y recursos dedicados. Los indicadores deben
    permitir ver la evolución en el tiempo y sostener las decisiones ante la dirección. Se revisan de vez en cuando para
    confirmar que siguen midiendo algo útil.
  aplica_basica: true
  aplica_media: true
