version: '2.0'
fecha: '2026-05-20'
fuente:
  titulo: 'Obligaciones legales clave para FULKRO · RGPD + LOPDGDD + NIS2 + DORA + AI Act · v2 EXPANDED 250'
  autor: 'FULKRO architect (curado v2 EXPAND 50→250 · sub-atom 1.C.0.C v3.9)'
  alcance: 'Obligaciones que un proveedor TIC sujeto a ENS debe cumplir en paralelo según sector y datos tratados. NO es asesoría jurídica - es mapping operativo para cross-compliance interno y A24.'
  total_obligations: 250
  distribucion:
    RGPD: 80
    LOPDGDD: 30
    NIS2: 60
    DORA: 50
    AI_Act: 30
  notas:
    - 'NIS2 transpuesta parcialmente en España vía Ley Coordinación Ciberseguridad (en tramite). Artículos referenciados son Directiva (UE) 2022/2555.'
    - 'DORA aplica solo a entidades financieras y sus proveedores TIC críticos.'
    - 'AI Act aplica si cliente desarrolla o despliega sistemas IA - revisión obligatoria.'
    - 'Cada obligación tiene vinculo_medida_ens orientativo · refinable per cliente.'
    - 'v2 EXPAND 50→250 (20 May 2026): +60 RGPD +26 LOPDGDD +48 NIS2 +40 DORA +26 AI Act = 200 entries adicionales canónicas curadas (sub-atom 1.C.0.C v3.9 plan EXPAND approved R32 sostenido).'

obligations:

  # ========== RGPD · Reglamento (UE) 2016/679 ==========

  - codigo: RGPD-ART-5
    regulacion: RGPD
    articulo: 'Art. 5'
    titulo: 'Principios del tratamiento'
    obligacion: 'Aplicar licitud, lealtad, transparencia, limitación de finalidad, minimización, exactitud, limitación de conservación, integridad/confidencialidad y responsabilidad proactiva.'
    sector_aplica: [todos]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'Política de protección de datos firmada + Registro Actividades Tratamiento (RAT)'
    vinculo_medida_ens: [org.1, mp.info.1]

  - codigo: RGPD-ART-6
    regulacion: RGPD
    articulo: 'Art. 6'
    titulo: 'Bases legítimas del tratamiento'
    obligacion: 'Documentar base jurídica de cada actividad (consentimiento, contrato, obligación legal, interés vital, interés público, interés legítimo).'
    sector_aplica: [todos]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'RAT con columna base jurídica por actividad'
    vinculo_medida_ens: [mp.info.1]

  - codigo: RGPD-ART-7
    regulacion: RGPD
    articulo: 'Art. 7'
    titulo: 'Condiciones del consentimiento'
    obligacion: 'Consentimiento libre, específico, informado, inequívoco, demostrable. Revocable en cualquier momento con misma facilidad que se otorgó.'
    sector_aplica: [todos]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'Logs de consentimiento con timestamp + versión política aceptada + mecanismo revocación funcional'
    vinculo_medida_ens: [mp.info.1, op.acc.1]

  - codigo: RGPD-ART-9
    regulacion: RGPD
    articulo: 'Art. 9'
    titulo: 'Categorías especiales de datos'
    obligacion: 'Prohibición general de tratar datos sensibles (salud, biométricos, origen racial, opiniones, etc.) salvo excepciones tasadas + medidas reforzadas.'
    sector_aplica: [salud, RRHH, todos con datos especiales]
    ens_categoria_aplica: [M, A]
    evidencia_requerida: 'Identificación categorías especiales en RAT + EIPD obligatoria + cifrado refuerzo'
    vinculo_medida_ens: [mp.info.3, mp.info.1, op.acc.5]

  - codigo: RGPD-ART-12
    regulacion: RGPD
    articulo: 'Art. 12'
    titulo: 'Información transparente al interesado'
    obligacion: 'Información concisa, transparente, inteligible, lenguaje claro. Proporcionada por escrito o medio electrónico.'
    sector_aplica: [todos]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'Cláusulas informativas en formularios + política privacidad versionada + accesible sin login'
    vinculo_medida_ens: [mp.info.1]

  - codigo: RGPD-ART-13-14
    regulacion: RGPD
    articulo: 'Arts. 13-14'
    titulo: 'Información a recoger y no recogida del interesado'
    obligacion: 'Suministrar identidad responsable, DPO, finalidad, base legítima, destinatarios, transferencias, plazo conservación, derechos, AEPD.'
    sector_aplica: [todos]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'Cláusulas completas Art.13/14 en todos los puntos de recogida'
    vinculo_medida_ens: [mp.info.1]

  - codigo: RGPD-ART-15
    regulacion: RGPD
    articulo: 'Art. 15'
    titulo: 'Derecho de acceso'
    obligacion: 'Atender solicitudes de acceso del interesado en máx. 1 mes (prorrogable 2 más con justificación).'
    sector_aplica: [todos]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'Procedimiento documentado + log respuestas con timestamp + plantilla respuesta'
    vinculo_medida_ens: [op.acc.1, mp.info.1]

  - codigo: RGPD-ART-16-22
    regulacion: RGPD
    articulo: 'Arts. 16-22'
    titulo: 'Derechos rectificación, supresión, oposición, limitación, portabilidad'
    obligacion: 'Implementar procedimientos para los 7 derechos ARSULIPO en plazos legales.'
    sector_aplica: [todos]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'Procedimientos documentados + logs respuestas + canal habilitado (email/formulario)'
    vinculo_medida_ens: [op.acc.1, mp.info.1]

  - codigo: RGPD-ART-24
    regulacion: RGPD
    articulo: 'Art. 24'
    titulo: 'Responsabilidad del responsable'
    obligacion: 'Aplicar medidas técnicas y organizativas apropiadas para demostrar cumplimiento. Revisar y actualizar.'
    sector_aplica: [todos]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'Política seguridad LOPD + análisis riesgos + auditoría LOPD bienal'
    vinculo_medida_ens: [org.1, org.3, op.pl.1]

  - codigo: RGPD-ART-25
    regulacion: RGPD
    articulo: 'Art. 25'
    titulo: 'Privacy by Design y by Default'
    obligacion: 'Aplicar protección de datos desde el diseño y por defecto. Minimización aplicada por defecto sin acción del interesado.'
    sector_aplica: [todos]
    ens_categoria_aplica: [M, A]
    evidencia_requerida: 'Documentación diseño sistemas + checklist PbD/PbD en proyectos + configuraciones por defecto restrictivas'
    vinculo_medida_ens: [mp.sw.1, mp.sw.2, op.pl.2]

  - codigo: RGPD-ART-28
    regulacion: RGPD
    articulo: 'Art. 28'
    titulo: 'Encargados de tratamiento'
    obligacion: 'Contrato escrito con encargados (objeto, duración, finalidad, tipo datos, obligaciones, autorizaciones subencargados, etc.).'
    sector_aplica: [todos con proveedores]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'Contratos de encargado firmados con todos los proveedores + revisión anual'
    vinculo_medida_ens: [op.ext.1, op.ext.2]

  - codigo: RGPD-ART-30
    regulacion: RGPD
    articulo: 'Art. 30'
    titulo: 'Registro de Actividades del Tratamiento (RAT)'
    obligacion: 'Mantener RAT actualizado con todas las actividades de tratamiento (excepción <250 empleados con riesgo bajo).'
    sector_aplica: [todos]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'RAT en formato electrónico + revisión anual + accesible para AEPD'
    vinculo_medida_ens: [mp.info.1, org.3]

  - codigo: RGPD-ART-32
    regulacion: RGPD
    articulo: 'Art. 32'
    titulo: 'Seguridad del tratamiento'
    obligacion: 'Aplicar medidas técnicas y organizativas para garantizar nivel de seguridad apropiado al riesgo (seudonimización, cifrado, resiliencia, restauración, evaluación periódica).'
    sector_aplica: [todos]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'Política seguridad + análisis riesgos LOPD + medidas técnicas implementadas y documentadas'
    vinculo_medida_ens: [mp.info.3, op.cont.2, op.pl.1]

  - codigo: RGPD-ART-33
    regulacion: RGPD
    articulo: 'Art. 33'
    titulo: 'Notificación brecha a AEPD'
    obligacion: 'Notificar brecha de seguridad a AEPD en máx. 72h desde conocimiento (si supone riesgo para derechos).'
    sector_aplica: [todos]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'Procedimiento gestión incidentes con plazo 72h + canal AEPD configurado + plantilla notificación'
    vinculo_medida_ens: [op.exp.7]

  - codigo: RGPD-ART-34
    regulacion: RGPD
    articulo: 'Art. 34'
    titulo: 'Comunicación brecha a interesados'
    obligacion: 'Comunicar a interesados sin dilación si la brecha entraña alto riesgo para derechos. Lenguaje claro.'
    sector_aplica: [todos]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'Plantilla comunicación + lista canales contacto interesados + criterios alto riesgo documentados'
    vinculo_medida_ens: [op.exp.7]

  - codigo: RGPD-ART-35
    regulacion: RGPD
    articulo: 'Art. 35'
    titulo: 'Evaluación de Impacto en Protección de Datos (EIPD/DPIA)'
    obligacion: 'EIPD obligatoria cuando tratamiento es probable que entrañe alto riesgo (nuevas tecnologías, evaluación sistemática, datos sensibles a gran escala, etc.).'
    sector_aplica: [todos con tratamientos alto riesgo]
    ens_categoria_aplica: [M, A]
    evidencia_requerida: 'EIPD documentada por proyecto + revisión periódica + consulta previa AEPD si riesgo no mitigado'
    vinculo_medida_ens: [op.pl.1, op.pl.2, mp.info.1]

  - codigo: RGPD-ART-37
    regulacion: RGPD
    articulo: 'Art. 37'
    titulo: 'Designación del Delegado de Protección de Datos (DPO)'
    obligacion: 'Designar DPO si autoridad pública, tratamiento sistemático a gran escala, datos especiales a gran escala. Comunicar a AEPD.'
    sector_aplica: [administracion publica, gran escala]
    ens_categoria_aplica: [M, A]
    evidencia_requerida: 'Designación DPO documentada + comunicación AEPD + contacto público accesible'
    vinculo_medida_ens: [org.1, org.4]

  - codigo: RGPD-ART-44-49
    regulacion: RGPD
    articulo: 'Arts. 44-49'
    titulo: 'Transferencias internacionales'
    obligacion: 'Transferir solo con garantías: decisión adecuación, CCT, BCR, excepción Art.49. Documentar.'
    sector_aplica: [todos con proveedores fuera UE/EEE]
    ens_categoria_aplica: [M, A]
    evidencia_requerida: 'Mapa transferencias internacionales + CCT firmadas + análisis adecuación país'
    vinculo_medida_ens: [op.ext.2, op.nub.1]

  - codigo: RGPD-ART-77
    regulacion: RGPD
    articulo: 'Art. 77'
    titulo: 'Derecho a reclamar a autoridad'
    obligacion: 'Informar a interesados de su derecho a reclamar ante AEPD (en cláusulas Art.13/14).'
    sector_aplica: [todos]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'Referencia explícita AEPD en política de privacidad y cláusulas'
    vinculo_medida_ens: [mp.info.1]

  - codigo: RGPD-ART-83
    regulacion: RGPD
    articulo: 'Art. 83'
    titulo: 'Régimen sancionador'
    obligacion: 'Conocer marco sancionador: multas hasta 20M€ o 4% facturación global anual (la mayor). Mitigar mediante cumplimiento demostrable.'
    sector_aplica: [todos]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'Programa cumplimiento documentado + evidencia auditorías + plan respuesta requerimientos AEPD'
    vinculo_medida_ens: [org.1, org.3]

  # ─── v2 EXPAND RGPD +60 entries adicionales (2026-05-20) ───

  - codigo: RGPD-ART-4
    regulacion: RGPD
    articulo: 'Art. 4'
    titulo: 'Definiciones clave RGPD'
    obligacion: 'Conocer y aplicar definiciones operativas: dato personal, tratamiento, responsable, encargado, destinatario, tercero, consentimiento, brecha, perfilado, seudonimización.'
    sector_aplica: [todos]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'Glosario interno + formación equipo + uso correcto terminología en políticas y RAT'
    vinculo_medida_ens: [mp.per.3, mp.info.1]
    fuente_url: 'https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32016R0679'

  - codigo: RGPD-ART-8
    regulacion: RGPD
    articulo: 'Art. 8'
    titulo: 'Consentimiento menores servicios información'
    obligacion: 'Consentimiento solo válido si menor tiene al menos 16 años (14 en España vía LOPDGDD). Verificar edad + recabar consentimiento parental si menor.'
    sector_aplica: [educacion, edtech, gaming, social, todos B2C menores]
    ens_categoria_aplica: [M, A]
    evidencia_requerida: 'Mecanismo verificación edad + flujo consentimiento parental + política protección menores'
    vinculo_medida_ens: [op.acc.1, mp.info.1]
    fuente_url: 'https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32016R0679#d1e1947-1-1'

  - codigo: RGPD-ART-10
    regulacion: RGPD
    articulo: 'Art. 10'
    titulo: 'Tratamiento datos condenas e infracciones penales'
    obligacion: 'Tratamiento solo bajo control autoridad pública o autorización Derecho UE/EM con garantías adecuadas. Registro completo prohibido fuera autoridad pública.'
    sector_aplica: [seguridad_privada, despachos_abogados, RRHH, administracion]
    ens_categoria_aplica: [M, A]
    evidencia_requerida: 'Análisis legitimación específica + restricción acceso + cifrado reforzado + log accesos'
    vinculo_medida_ens: [mp.info.3, op.acc.5, op.exp.4]
    fuente_url: 'https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32016R0679'

  - codigo: RGPD-ART-11
    regulacion: RGPD
    articulo: 'Art. 11'
    titulo: 'Tratamiento que no requiere identificación'
    obligacion: 'Si finalidad no requiere identificación, responsable no obligado a mantener/recabar/tratar info adicional para identificar interesado. Reduce alcance derechos.'
    sector_aplica: [analytics, investigacion, estadistica]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'Documentación finalidad anonimizada + procedimiento documentación irreversibilidad anonimización'
    vinculo_medida_ens: [mp.info.6]
    fuente_url: 'https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32016R0679'

  - codigo: RGPD-ART-17
    regulacion: RGPD
    articulo: 'Art. 17'
    titulo: 'Derecho de supresión (derecho al olvido)'
    obligacion: 'Atender solicitudes supresión sin dilación cuando: ya no necesarios, retira consentimiento, oposición, tratamiento ilícito, obligación legal, datos menores. Notificar a terceros.'
    sector_aplica: [todos]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'Procedimiento supresión + log peticiones + notificación a terceros documentada + plazos ≤1 mes'
    vinculo_medida_ens: [op.acc.1, mp.info.6]
    fuente_url: 'https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32016R0679'

  - codigo: RGPD-ART-18
    regulacion: RGPD
    articulo: 'Art. 18'
    titulo: 'Derecho a la limitación del tratamiento'
    obligacion: 'Permitir al interesado limitar tratamiento cuando: impugna exactitud, tratamiento ilícito, ya no necesarios pero interesado los necesita, oposición pendiente verificar.'
    sector_aplica: [todos]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'Procedimiento limitación técnica (flag/marcado) + plantilla respuesta + plazos respuesta'
    vinculo_medida_ens: [mp.info.6, op.acc.1]
    fuente_url: 'https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32016R0679'

  - codigo: RGPD-ART-19
    regulacion: RGPD
    articulo: 'Art. 19'
    titulo: 'Obligación de notificación rectificación/supresión/limitación a destinatarios'
    obligacion: 'Comunicar rectificación, supresión o limitación a cada destinatario al que se hayan comunicado los datos (salvo imposible o esfuerzo desproporcionado).'
    sector_aplica: [todos con compartición datos]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'Registro destinatarios por actividad + procedimiento notificación + log notificaciones'
    vinculo_medida_ens: [op.ext.1, mp.info.6]
    fuente_url: 'https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32016R0679'

  - codigo: RGPD-ART-20
    regulacion: RGPD
    articulo: 'Art. 20'
    titulo: 'Derecho a la portabilidad de los datos'
    obligacion: 'Permitir recibir datos en formato estructurado, uso común, lectura mecánica + transmitir a otro responsable sin impedimentos.'
    sector_aplica: [todos con tratamiento automatizado + consentimiento/contrato]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'API/export funcional formato estándar (JSON/CSV) + procedimiento + plazo ≤1 mes'
    vinculo_medida_ens: [mp.info.2]
    fuente_url: 'https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32016R0679'

  - codigo: RGPD-ART-21
    regulacion: RGPD
    articulo: 'Art. 21'
    titulo: 'Derecho de oposición'
    obligacion: 'Permitir oposición tratamiento basado en interés legítimo o público. Marketing directo: oposición incondicional. Investigación científica/histórica: salvo interés público.'
    sector_aplica: [todos especialmente marketing]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'Unsubscribe funcional 1-click + flag oposición persistente + procedimiento documentado'
    vinculo_medida_ens: [op.acc.1, mp.info.6]
    fuente_url: 'https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32016R0679'

  - codigo: RGPD-ART-22
    regulacion: RGPD
    articulo: 'Art. 22'
    titulo: 'Decisiones individuales automatizadas, incluida la elaboración de perfiles'
    obligacion: 'No someter a decisión basada únicamente en tratamiento automatizado con efectos jurídicos significativos. Excepciones: necesario contrato, autoriza Derecho UE/EM, consentimiento explícito.'
    sector_aplica: [fintech, scoring, HR_automation, IA decisional]
    ens_categoria_aplica: [M, A]
    evidencia_requerida: 'Documentación lógica algoritmo + intervención humana garantizada + derecho impugnación + DPIA'
    vinculo_medida_ens: [mp.sw.1, op.acc.1, op.pl.2]
    fuente_url: 'https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32016R0679'

  - codigo: RGPD-ART-26
    regulacion: RGPD
    articulo: 'Art. 26'
    titulo: 'Corresponsables del tratamiento'
    obligacion: 'Acuerdo escrito entre corresponsables definiendo respectivas responsabilidades RGPD. Aspectos esenciales disponibles al interesado.'
    sector_aplica: [todos con joint controllers]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'Acuerdo corresponsabilidad firmado + resumen público accesible + revisión anual'
    vinculo_medida_ens: [op.ext.1, mp.info.1]
    fuente_url: 'https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32016R0679'

  - codigo: RGPD-ART-27
    regulacion: RGPD
    articulo: 'Art. 27'
    titulo: 'Representante en la UE de responsables no establecidos'
    obligacion: 'Responsables/encargados no establecidos en UE que tratan datos personas en UE deben designar representante UE por escrito (excepciones limitadas).'
    sector_aplica: [extranjeros_no_UE_con_clientes_UE]
    ens_categoria_aplica: [M, A]
    evidencia_requerida: 'Designación representante UE documentada + datos contacto en política privacidad'
    vinculo_medida_ens: [org.4]
    fuente_url: 'https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32016R0679'

  - codigo: RGPD-ART-29
    regulacion: RGPD
    articulo: 'Art. 29'
    titulo: 'Tratamiento bajo autoridad del responsable o encargado'
    obligacion: 'Encargado y personas con acceso solo traten datos por instrucciones documentadas responsable (salvo obligación legal).'
    sector_aplica: [todos con personal/encargados]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'Instrucciones documentadas en contrato encargado + acuerdos confidencialidad personal'
    vinculo_medida_ens: [op.ext.1, mp.per.1, mp.per.2]
    fuente_url: 'https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32016R0679'

  - codigo: RGPD-ART-31
    regulacion: RGPD
    articulo: 'Art. 31'
    titulo: 'Cooperación con la autoridad de control'
    obligacion: 'Cooperar con AEPD cuando lo solicite en ejercicio funciones. Suministrar información requerida en plazo.'
    sector_aplica: [todos]
    ens_categoria_aplica: [B, M, A]
    evidencia_requerida: 'Procedimiento respuesta requerimientos AEPD + canal designado + plazo respuesta ≤30 días'
    vinculo_medida_ens: [org.3, org.4]
    fuente_url: 'https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32016R0679'

  - codigo: RGPD-ART-36
    regulacion: RGPD
    articulo: 'Art. 36'
    titulo: 'Consulta previa a la AEPD'
    obligacion: 'Consultar AEPD antes tratamiento si DPIA indica riesgo alto no mitigado. AEPD responde en 8 semanas (prorrogable +6).'
    sector_aplica: [tratamientos_alto_riesgo_no_mitigado]
    ens_categoria_aplica: [M, A]
    evidencia_requerida: 'Procedimiento consulta previa + DPIA completa + respuesta AEPD archivada'
    vinculo_medida_ens: [op.pl.1, op.pl.2]
    fuente_url: 'https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32016R0679'

  - codigo: RGPD-ART-38
    regulacion: RGPD
    articulo: 'Art. 38'
    titulo: 'Posición del Delegado de Protección de Datos'
    obligacion: 'DPO involucrado en todas cuestiones protección datos. Recursos necesarios. Independencia: no instrucciones, no destituible por funciones, reporta máximo nivel.'
