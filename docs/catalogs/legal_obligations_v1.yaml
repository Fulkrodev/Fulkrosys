  - codigo: AIACT-ART-9
    regulacion: AI_Act
    articulo: 'Art. 9'
    titulo: 'Sistema gestión riesgos IA alto riesgo'
    obligacion: 'Establecer, implantar, documentar y mantener sistema gestión riesgos durante todo el ciclo vida del sistema IA alto riesgo.'
    sector_aplica: [proveedores IA alto riesgo]
    ens_categoria_aplica: [M, A]
    evidencia_requerida: 'Documentación gestión riesgos IA + revisión cíclica + pruebas pre-mercado + monitorización post-mercado'
