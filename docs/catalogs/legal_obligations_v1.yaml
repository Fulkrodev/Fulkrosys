    obligacion: 'No desplegar sistemas IA prohibidos: manipulación cognitiva conductual, vulnerabilidades grupos, social scoring, predictivos delitos por perfilado, scraping facial masivo, reconocimiento emociones laboral/educativo, biometría categorización sensible, identificación biométrica remota tiempo real espacios públicos (salvo excepciones).'
    sector_aplica: [todos con sistemas IA]
    ens_categoria_aplica: [M, A]
