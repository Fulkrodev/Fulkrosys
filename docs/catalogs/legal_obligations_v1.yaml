    articulo: 'Art. 99'
    titulo: 'Régimen sancionador AI Act'
    obligacion: 'Sanciones: hasta 35M€ o 7% facturación (prohibiciones), 15M€ o 3% (alto riesgo), 7.5M€ o 1.5% (transparencia).'
