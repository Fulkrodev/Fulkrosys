    evidencia_tipica: "Documento firmado por órgano superior + acta de aprobación + registro de difusión + acuse de recibo del personal"
    notas_auditor: "Siempre es la primera pregunta del auditor ENAC. Si no existe política formal aprobada, la visita termina en los primeros 15 minutos."

