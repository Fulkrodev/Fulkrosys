# Catálogo de reglas de severidad y quick-wins para Motor 4 Gap Analysis Engine
# ============================================================================
# Plataforma: FULKRO ENS
# Motor: Motor 4 — Gap Analysis Engine (ENS Platform Master Spec v2.1 §5.4)
# Fuente normativa: Anexo II RD 311/2022 + CCN-STIC 803 + CCN-STIC 808
# Propósito: determinar severidad base de cada gap, esfuerzo estimado por
#            categoría del sistema (B/M/A), y flag de quick-win. Usado por
#            el Gap Analysis Engine para priorizar findings sin alucinación.
# Generado por: Anthropic para Fulkro, revisado contra CCN-STIC 803 §4
# Versión: 1.0
# Fecha: 2026-04-14

version: "1.0"
fecha: "2026-04-14"
fuente: "ENS Platform Master Spec v2.1 §5.4 + Anexo II RD 311/2022 + CCN-STIC 808"

# =========================================================================
# MEDIDAS CRÍTICAS NUCLEARES
# =========================================================================
# Estas medidas tienen prioridad absoluta en la auditoría ENAC. Un gap en
# cualquiera de ellas bloquea la certificación. El spec §5.4 menciona
# explícitamente op.acc.6, mp.info.3 y op.exp.7 como "siempre primero".
# Completado con criterio consultor basado en CCN-STIC 808 §requisitos
# nucleares (requisitos marcados en gris que siempre se evalúan).
medidas_criticas_nucleares:
  - org.1       # Política de seguridad — sin esto el auditor no empieza
  - op.pl.1     # Análisis de riesgos — base de todo el SGSI
  - op.acc.6    # MFA usuarios internos — el auditor mira con lupa
  - op.exp.1    # Inventario de activos — sin inventario no hay alcance
  - op.exp.4    # Parches de seguridad — CVE críticas sin parchear = NC mayor
  - op.exp.7    # Gestión de incidentes — incluye LUCIA
  - op.exp.8    # Registro de actividad — sin logs no hay auditoría
  - op.cont.1   # Análisis de impacto BIA — fundamental para Medio/Alto
  - mp.info.3   # Cifrado — datos sensibles sin cifrar = NC mayor inmediato
  - mp.per.3    # Concienciación del personal — factor humano

# =========================================================================
# THRESHOLDS DEL MOTOR
# =========================================================================
thresholds:
  # Quick win: severidad alta o superior AND esfuerzo <= 24h
  # Esto captura las acciones "gran impacto, poco coste" para el feed
  # del cliente (Agente 16 Quick Wins las publica como motivación)
  quick_win_max_horas: 24
  quick_win_min_severidad_numeric: 4   # 4 = alta

  # Semáforo del dashboard del motor
  # score = severidad_numeric * gap_magnitude (1-5)
  semaforo:
    rojo_min_score: 15     # ~ severidad alta + gap_magnitude 4+
    amarillo_min_score: 6  # ~ severidad media + gap_magnitude 2

# =========================================================================
# MAPPING SEVERIDAD A NUMÉRICO
# =========================================================================
severidad_scoring:
  critica: 5
  alta: 4
  media: 3
  baja: 2
  informativa: 1

# =========================================================================
# CATÁLOGO DE 73 MEDIDAS DEL ANEXO II
# =========================================================================
# Cada entrada tiene:
#   codigo: el código oficial del Anexo II
#   nombre: nombre oficial de la medida
#   familia: familia del marco (org, op.pl, op.acc, etc.)
#   marco: organizativo | operacional | proteccion
#   aplica_desde: basica | media | alta (categoría mínima donde aplica)
#   severidad_base: severidad asignada al gap por categoría del sistema
#   esfuerzo_horas_base: horas estimadas por categoría para cerrar el gap
#                        desde L1 hasta estado objetivo (no desde L0)
#   quick_win: true si severidad >= alta AND esfuerzo_media <= 24
#   guia_remediacion: texto corto de orientación al consultor
#   evidencia_tipica: qué evidencia espera el auditor
#   notas_auditor: observación práctica del criterio ENAC
#
# Criterio de esfuerzo: horas de trabajo consultor+cliente para cerrar un
# gap típico, asumiendo que el cliente parte de madurez L1-L2. Multiplicar
# por factor de Apéndice N del spec para cálculo total del proyecto.

