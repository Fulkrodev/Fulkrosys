# MAGERIT v3 — Catálogo completo de salvaguardas
# Fuente: Libro II "Catálogo de Elementos", Capítulo 6 (p.53-57)
# 16 familias oficiales (6.1 a 6.16), extraídas directamente del PDF
# efficacy_typical: bajo(20%), medio(50%), alto(70%), muy_alto(90%)

safeguard_families:

  # === 6.1 Protecciones generales u horizontales === # Libro II, p.53
  - family: "H"
    section: "6.1"
    name: "Protecciones generales u horizontales"
    page: 53
    safeguards:
      - code: "H.IA"
        name: "Identificación y autenticación"
        protects_assets: [S, D, SW, HW, COM]
        mitigates: [A.5, A.6, A.11]
        efficacy_typical: "alto"
      - code: "H.AC"
        name: "Control de acceso lógico"
        protects_assets: [S, D, SW]
        mitigates: [A.6, A.7, A.11]
        efficacy_typical: "alto"
      - code: "H.ST"
        name: "Segregación de tareas"
        protects_assets: [S, D, SW, P]
        mitigates: [A.6, E.1, E.2]
        efficacy_typical: "medio"
      - code: "H.IR"
        name: "Gestión de incidencias"
        protects_assets: [S, D, SW, HW, COM]
        mitigates: [A.8, A.24, E.8]
        efficacy_typical: "alto"
      - code: "H.tools.AV"
        name: "Herramienta contra código dañino"
        protects_assets: [SW, HW]
        mitigates: [E.8, A.8]
        efficacy_typical: "alto"
      - code: "H.tools.IDS"
        name: "IDS/IPS: Detección/prevención de intrusión"
        protects_assets: [COM, S]
        mitigates: [A.11, A.24, A.12]
        efficacy_typical: "medio"
      - code: "H.tools.CC"
        name: "Herramienta de chequeo de configuración"
        protects_assets: [SW, HW, COM]
        mitigates: [E.4, A.4]
        efficacy_typical: "medio"
      - code: "H.tools.VA"
        name: "Herramienta de análisis de vulnerabilidades"
        protects_assets: [SW, HW, COM]
        mitigates: [E.20, A.11]
        efficacy_typical: "medio"
      - code: "H.tools.TM"
        name: "Herramienta de monitorización de tráfico"
        protects_assets: [COM]
        mitigates: [A.12, A.14]
        efficacy_typical: "medio"
      - code: "H.tools.DLP"
        name: "DLP: Monitorización de contenidos"
        protects_assets: [D, COM]
        mitigates: [E.14, E.19, A.19]
        efficacy_typical: "medio"
      - code: "H.tools.LA"
        name: "Herramienta para análisis de logs"
        protects_assets: [S, SW]
        mitigates: [A.3, E.3]
        efficacy_typical: "medio"
      - code: "H.tools.HP"
        name: "Honey net / honey pot"
        protects_assets: [COM, S]
        mitigates: [A.11, A.5]
        efficacy_typical: "bajo"
      - code: "H.tools.SFV"
        name: "Verificación de las funciones de seguridad"
        protects_assets: [SW, HW]
        mitigates: [E.20, A.22]
        efficacy_typical: "medio"
      - code: "H.VM"
        name: "Gestión de vulnerabilidades"
        protects_assets: [SW, HW, COM]
        mitigates: [E.20, A.8, A.11]
        efficacy_typical: "alto"
      - code: "H.AU"
        name: "Registro y auditoría"
        protects_assets: [S, D, SW]
        mitigates: [A.3, A.6, E.3]
        efficacy_typical: "medio"

  # === 6.2 Protección de los datos/información === # Libro II, p.54
