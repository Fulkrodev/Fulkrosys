        mitigates: [E.18, A.18, N.1, N.2, I.5]
        efficacy_typical: "muy_alto"
      - code: "D.I"
        name: "Aseguramiento de la integridad"
        protects_assets: [D, SW]
        mitigates: [A.15, E.15]
        efficacy_typical: "muy_alto"
      - code: "D.C"
        name: "Cifrado de la información"
        protects_assets: [D, SI]
        mitigates: [A.14, A.19, E.14, A.11]
