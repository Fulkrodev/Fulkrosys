# Umbrales de las evaluaciones de agentes (golden datasets) usados como gate de CI.
#
# Lo consume .github/workflows/evals.yml. La documentación completa —qué mide cada
# gate, qué significa que esté verde y qué NO mide— está en docs/CI.md.
#
# Regla de oro de este fichero: cada número lleva escrito de dónde sale y qué pasa
# cuando se roza. Si cambias un número aquí sin cambiar la justificación, el gate
# de auto-consistencia del arnés (job `evals-arnes`) te lo tumba, porque compara
# estos valores contra los que el propio dataset declara en su JSON.

version: 1

# ─────────────────────────────────────────────────────────────────────────────
# Cobertura real, medida, sin maquillar
# ─────────────────────────────────────────────────────────────────────────────
cobertura:
  # Medido: command grep -rn "(AgentBase)" backend/app --include=*.py | wc -l  →  13
  clases_de_agente_implementadas: 13

  # Medido: find docs/catalogs/golden_datasets/ -name '*.json' | wc -l  →  4
  # Cuenta DATASETS, que no es lo mismo que clases de agente cubiertas: ver
  # `clases_de_agente_con_golden_dataset` justo debajo.
  agentes_con_golden_dataset: 4

  # Medido: de los 4 datasets, cuántos llevan el nombre de una de las 13 clases.
  #   $ for d in docs/catalogs/golden_datasets/*/; do basename "$d"; done
  #   agent_06_contratos · agent_18_reunion · agent_27_clasificador ·
  #   deliverable_text_auditor
  #   $ command grep -rn "(AgentBase)" backend/app --include=*.py \
  #       | sed 's#.*/##; s#\.py.*##' | sort
  #   → agent_06_contratos, agent_18_reunion y agent_27_clasificador están;
  #     deliverable_text_auditor NO (es una capability, su módulo no declara
  #     ninguna clase y no hereda de AgentBase).
  clases_de_agente_con_golden_dataset: 3

  # BLOQUE D · D2 (2026-09-10). Antes ponía 1 y decía "1 de 13"; la auditoría
  # de 2026-09 lo corrigió a 0 de 13 porque el único dataset no era un agente.
  nota: >-
    Hay 4 golden datasets con 10 entradas cada uno, 40 en total. Tres de ellos
    son clases de agente: agent_27_clasificador, agent_18_reunion y
    agent_06_contratos. El cuarto, deliverable_text_auditor, es una capability
    y NO hereda de AgentBase, así que no cuenta como clase de agente cubierta.
    Por tanto la cobertura sobre las 13 clases es 3 de 13, y el total de
    objetivos evaluados es 4. Las otras 10 clases de agente NO tienen
    evaluación de ningún tipo: no hay número que enseñar sobre ellas, ni bueno
    ni malo. Los tres agentes nuevos se eligieron porque su salida es
    estructura verificable sin juicio —clasificación sobre catálogo cerrado
    (A27), extracción con enumerados y rangos (A18) y mapeo sobre catálogo de
    cláusulas dependiente de la categoría ENS (A6)—; los que producen prosa
    (A4 redactor, A19 propuestas, A20 negociación, A14 copiloto) siguen sin
    dataset a propósito, porque evaluarlos exigiría un criterio subjetivo.

# ─────────────────────────────────────────────────────────────────────────────
# Gates
# ─────────────────────────────────────────────────────────────────────────────
gates:

  # Gate 1 · arnés. Determinista, sin red y sin clave de API. Corre SIEMPRE y
  # puede tumbar el build. Es el gate que de verdad protege hoy: para CADA
  # dataset comprueba que carga, que valida contra su esquema, que hay un
  # evaluador registrado, que hay un constructor de salida sintética registrado
  # (D2) y que dataset y evaluador siguen siendo compatibles entre sí.
  arnes:
    datasets_minimos: 4
    # Por qué 4: hoy hay exactamente 4 datasets descubribles
    # (find docs/catalogs/golden_datasets/ -name '*.json' | wc -l → 4). Este
    # número existe para que borrar cualquiera de ellos rompa el build en vez
    # de pasar en verde con menos cobertura de la declarada. Sube cuando suba
    # la cobertura; nunca baja sin escribir aquí por qué.
    obligatorio: true

  # Gate 2 · evaluación real contra el LLM. Necesita ANTHROPIC_API_KEY porque el
  # LLM ES lo que se está midiendo: los cuatro proveedores llaman al modelo
  # (deliverable_text_auditor_capability a Sonnet; A27 a Haiku 4.5; A18 y A6 a
  # Sonnet 4.6). Sin secreto NO se puede evaluar: el job queda SALTADO y no
  # finge un verde.
  llm:
    secreto_requerido: ANTHROPIC_API_KEY
    # D6 (2026-09-10): cuando el secreto no está, el job `evals-llm` queda
    # SALTADO (gris), no verde. Antes terminaba en verde escribiendo
    # "EVALUACIÓN NO EJECUTADA" en el resumen: el texto era honesto y el icono
    # decía lo contrario, y el icono es lo que se lee.
    # Para exigirla (recomendado en el repo de origen, donde el secreto SÍ existe):
    # crear la variable de repositorio FULKRO_EVALS_REQUIRED = "true"
    # (Settings → Secrets and variables → Actions → pestaña Variables).
    # Con esa variable a "true", el job SÍ arranca sin secreto, y falla.
    variable_para_exigirla: FULKRO_EVALS_REQUIRED
    obligatorio_por_defecto: false

# ─────────────────────────────────────────────────────────────────────────────
# Política por dataset
# ─────────────────────────────────────────────────────────────────────────────
datasets:

  deliverable_text_auditor/v1:

    entradas_curadas: 10
    # Medido: python -c "import json;print(len(json.load(open('docs/catalogs/golden_datasets/deliverable_text_auditor/v1.json'))['entries']))" → 10
    # 4 PASS_AUDITOR_READY + 4 FAIL_CRITICAL + 2 NEEDS_REVISION, curadas por Marcos.

    min_entradas_evaluadas: 10
    # ESTE es el número que impide el verde vacuo, y es el más importante del
    # fichero. Medido, sin clave de API:
    #   python -m backend.app.motors.m_observability.eval_runner \
    #     --agent deliverable_text_auditor --format json
    #   → total_entries 0, pass_rate 1.0, severity "ok", exit 0
    # Es decir: el runner declara 100% de aciertos habiendo evaluado CERO
    # entradas, porque una tasa de aciertos sobre un denominador vacío vale 1.0
    # por convenio. Exigir 10 entradas evaluadas convierte ese verde en rojo.
    # Si alguien añade entradas al dataset, este número sube con él (el gate del
    # arnés comprueba que entradas_curadas coincide con el JSON).

    min_pass_rate: 0.80
    # De dónde sale: es el mismo 0.8 que el dataset declara en
    # regression_thresholds.pass_rate_warn_below. NO es un número nuevo inventado
    # para CI; se copia aquí para poder aplicarlo como gate y el job `evals-arnes`
    # verifica que ambos siguen siendo iguales (guardia anti-deriva).
    # Qué significa: con 10 entradas, 8 aciertos pasan y 7 no. Es decir, el gate
    # tolera exactamente 2 fallos de 10.
    # Qué pasa cuando se roza (pass_rate == 0.80): PASA. La comparación es
    # >= min_pass_rate. Rozarlo no es una victoria: significa 2 de 10 mal, y con
    # 10 entradas cada entrada vale 10 puntos, así que un solo caso nuevo mal
    # curado mueve el resultado un 10%. Con un dataset tan pequeño, un verde por
    # los pelos hay que mirarlo a mano antes de fusionar, no celebrarlo.

    pass_rate_alerta: 0.60
    # Mismo origen: regression_thresholds.pass_rate_alert_below del JSON. El
    # runner devuelve exit 2 (alerta) por debajo de este valor y exit 1 (aviso)
    # entre 0.60 y 0.80. Para el gate de CI ambos son fallo; la distinción sirve
    # para el mensaje del resumen: por debajo de 0.60 no es una regresión, es que
    # el agente ha dejado de funcionar.

    tolerancia_de_reintento: 0
    # No se reintenta. El LLM corre a temperatura 0.0 (R3) en
    # deliverable_text_auditor_capability, así que un fallo NO se atribuye a
    # varianza de muestreo por defecto. Si en el futuro se observa oscilación
    # real medida entre ejecuciones idénticas, se sube este número Y se escribe
    # aquí la medición que lo justifica.

  # ───────────────────────────────────────────────────────────────────────────
  # BLOQUE D · D2 (2026-09-10) · tres agentes nuevos
  #
  # Los tres se eligieron por el mismo motivo: su salida es estructura, no
  # prosa, y por tanto se comprueba con igualdad, pertenencia a conjunto
  # cerrado y rangos numéricos. Los umbrales de los tres son idénticos a los
  # del dataset que ya existía (0.80 / 0.60) y NO por comodidad: son los que
  # el propio JSON declara en regression_thresholds, y el gate del arnés
  # verifica que ambos siguen coincidiendo. No hay medición que justifique
  # apartarse de ellos, porque no hay todavía ni una sola ejecución real
  # contra el modelo de la que sacar una tasa base (ver `tolerancia_de_reintento`).
  # ───────────────────────────────────────────────────────────────────────────

  agent_27_clasificador/v1:

    entradas_curadas: 10
    # Medido: python3 -c "import json;print(len(json.load(open('docs/catalogs/golden_datasets/agent_27_clasificador/v1.json'))['entries']))" → 10
    # 5 fáciles (señal unívoca en el contenido) + 3 límite (documento que cabe
    # de verdad en dos carpetas del catálogo §2.15) + 2 que deben fallar si el
    # modelo adivina (fichero equivocado con nombre engañoso, y extracción OCR
    # que sólo recuperó cabeceras).

    min_entradas_evaluadas: 10
    # Mismo papel que en deliverable_text_auditor: es el número que impide el
    # verde vacuo. Sin él, cero entradas evaluadas dan pass_rate 1.0 por
    # convenio (una tasa sobre denominador vacío) y el gate pasaría con el
    # dataset entero saltado. Se exigen las 10 porque el proveedor de este
    # agente no puede declinar ninguna: no hay entradas sin texto que enviar.

    min_pass_rate: 0.80
    # De dónde sale: es el mismo 0.8 que el JSON declara en
    # regression_thresholds.pass_rate_warn_below, copiado aquí para poder
    # aplicarlo como gate. El job `evals-arnes` verifica que ambos siguen
    # siendo iguales (guardia anti-deriva).
    # Qué significa con 10 entradas: 8 aciertos pasan y 7 no, o sea que el
    # gate tolera exactamente 2 fallos de 10. Cada entrada vale 10 puntos, así
    # que un verde por los pelos hay que mirarlo a mano antes de fusionar.

    pass_rate_alerta: 0.60
    # Mismo origen: regression_thresholds.pass_rate_alert_below del JSON. Por
    # debajo de esto no es una regresión, es que el agente ha dejado de
    # clasificar.

    tolerancia_de_reintento: 0
    # No se reintenta. El agente corre a temperature 0.1 (R3), así que un
    # fallo NO se atribuye por defecto a varianza de muestreo. Este cero es
    # además honesto en un segundo sentido: NO se ha ejecutado todavía ninguna
    # evaluación real contra el modelo para este dataset (hace falta
    # ANTHROPIC_API_KEY), así que no existe ninguna medición de oscilación
    # entre ejecuciones idénticas de la que sacar otro número. Si algún día se
    # observa esa oscilación, se sube este valor Y se escribe aquí la medición.

  agent_18_reunion/v1:

    entradas_curadas: 10
    # Medido: python3 -c "import json;print(len(json.load(open('docs/catalogs/golden_datasets/agent_18_reunion/v1.json'))['entries']))" → 10
    # 4 fáciles + 4 límite (información parcial, plazo imposible, contradicción
    # entre lo que dice dirección y lo que dice el técnico, cliente que pide
    # una categoría que no le corresponde) + 2 que deben fallar si el modelo
    # adivina (los seis bloques vacíos, y seis bloques llenos de ruido).

    min_entradas_evaluadas: 10
    # Igual que arriba: es lo que convierte "0 evaluadas, 100%" en rojo. Las
    # 10 son evaluables siempre; la entrada de bloques vacíos también, porque
    # lo que se mide ahí es precisamente que el modelo conteste UNKNOWN en vez
    # de inventarse una categoría.

    min_pass_rate: 0.80
    # Copiado de regression_thresholds.pass_rate_warn_below del JSON; el gate
    # del arnés comprueba que no se separen. Tolera 2 fallos de 10.

    pass_rate_alerta: 0.60
    # Copiado de regression_thresholds.pass_rate_alert_below del JSON.

    tolerancia_de_reintento: 0
    # temperature 0.1 en el agente (R3) y, otra vez, cero ejecuciones reales
    # medidas: no hay dato de varianza que justifique reintentar.

  agent_06_contratos/v1:

    entradas_curadas: 10
    # Medido: python3 -c "import json;print(len(json.load(open('docs/catalogs/golden_datasets/agent_06_contratos/v1.json'))['entries']))" → 10
    # 4 fáciles (incluidas las dos anclas de la escala: un contrato que cubre
    # las diez cláusulas exigibles en MEDIA y otro que no cubre ninguna) +
    # 4 límite (cláusula que existe y no cumple, hueco sectorial de sanidad,
    # contrato administrativo mudo en lo técnico, auditoría cosmética) + 2 que
    # deben fallar si el modelo alucina (un contrato de suministro eléctrico y
    # una extracción OCR rota).

    min_entradas_evaluadas: 10
    # Igual que arriba.

    min_pass_rate: 0.80
    # Copiado de regression_thresholds.pass_rate_warn_below del JSON; el gate
    # del arnés comprueba que no se separen. Tolera 2 fallos de 10.

    pass_rate_alerta: 0.60
    # Copiado de regression_thresholds.pass_rate_alert_below del JSON.

    tolerancia_de_reintento: 0
    # temperature 0.1 en el agente (R3) y cero ejecuciones reales medidas.
