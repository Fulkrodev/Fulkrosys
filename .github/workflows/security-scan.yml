# Security Scan · Ejecutable 3 Phase 5.1 SUPER MEGA PROMPT re-architected.
#
# CI gate cumulative pre-piloto MEDIA cliente:
#   - bandit · Python SAST (backend/app/) · gate HIGH severity = block merge
#   - safety · Python dep vulnerabilities · crash de la herramienta = block ·
#     hallazgos = aviso (o block si existe .github/safety-baseline.json)
#   - npm audit · Node dep vulnerabilities (frontend/) · gate critical = block
#
# OPS-052 audit-first Phase 5.0 reveal: NO bandit/safety/npm audit existing
# en .github/workflows/ci.yml · greenfield wiring. Future-X identificado:
# SAST MCP bandit_tool.py wire-in agent-driven scans (post-piloto).
#
# Triggered on:
#   - push to main (verify clean state cumulative)
#   - pull_request (PR gate · block merge si HIGH/CRITICAL findings)
#   - schedule weekly (Monday 06:00 UTC · catch new CVE disclosures)
#   - manual workflow_dispatch (Marcos on-demand)

name: Security Scan

on:
  push:
    branches: [main]
    paths:
      - 'backend/**/*.py'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'backend/pyproject.toml'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches: [main]
  schedule:
    # Lunes 06:00 UTC · cumulative weekly catch new CVE disclosures
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  bandit:
    name: bandit · Python SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bandit
        run: pip install 'bandit[toml]>=1.7.5'

      - name: Run bandit · gate HIGH severity
        # -ll = LOW level baseline · -lll = MEDIUM · gate HIGH = exit 1
        # --severity-level high · --confidence-level high
        # Excluded: __pycache__ + tests (test SQL injection patterns expected)
        run: |
          bandit -r backend/app/ \
            --severity-level high \
            --confidence-level high \
            --exclude __pycache__,tests \
            --format json \
            --output bandit-report.json \
            || (cat bandit-report.json && exit 1)

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  safety:
    name: safety · Python dep vulnerabilities
    runs-on: ubuntu-latest
    # 2026-09-10 · REESCRITO. La versión anterior no comprobaba NADA, por dos
    # motivos independientes y ambos medidos:
    #
    #   1. La invocación era inválida para safety 3.x:
    #        $ safety check --json --output safety-report.json --continue-on-error
    #        Error: Invalid value for '--output' / '-o': 'safety-report.json' is
    #        not one of 'screen', 'text', 'json', 'bare', 'html'.   # exit 2
    #      La ruta del informe va en --save-json; --output sólo acepta un FORMATO.
    #      Resultado: safety salía con código 2 y NO escribía informe.
    #   2. El parser inline hacía `except Exception: sys.exit(0)`, así que la
    #      ausencia del informe se leía como «sin CRITICAL» y el job salía verde.
    #      Un `|| true` remataba la máscara.
    #
    # Y aun con informe, el filtro `severity == 'critical'` era inalcanzable: sin
    # API key safety deja `severity: null` en TODAS las vulnerabilidades (medido:
    # 102 de 102 con severity None).
    #
    # Ahora: se captura el código de salida de safety a propósito (sin `|| true`)
    # y se le pasa al gate, que distingue «la herramienta reventó» (BLOQUEA) de
    # «corrió y encontró hallazgos» (AVISA) y de «corrió limpia» (pasa). La
    # política y el mecanismo de baseline están documentados en la cabecera de
    # .github/scripts/safety_gate.py.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install safety + project deps
        run: |
          # pycairo (dep transitiva) compila desde fuente → necesita cairo dev libs
          sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2-dev pkg-config
          # Pin a la versión sobre la que se midió el formato del informe. Subirla
          # es bienvenido: si el esquema cambia, el gate BLOQUEA y lo dice, en vez
          # de leer el informe nuevo como si estuviera limpio.
          pip install 'safety==3.8.1'
          cd backend && pip install -e .

      - name: Run safety (captura el código de salida, SIN `|| true`)
        id: safety
        run: |
          # `set +e` aquí no es una máscara: el código se captura y se le entrega
          # al gate del paso siguiente, que es quien decide. Sin esto, `set -e`
          # tumbaría el paso con código 64 (= «corrió y encontró vulnerabilidades»),
          # que es un desenlace legítimo y no un fallo de la herramienta.
          set +e
          safety check --output json --save-json safety-report.json
          rc=$?
          set -e
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          echo "safety terminó con código ${rc} (0=limpio · 64=con hallazgos · resto=fallo)"

      - name: Gate safety (crash → falla · hallazgos → avisa · limpio → pasa)
        run: |
          python .github/scripts/safety_gate.py \
            --report safety-report.json \
            --tool-exit-code "${{ steps.safety.outputs.rc }}" \
            --baseline .github/safety-baseline.json

      - name: Upload safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: safety-report.json
          retention-days: 30

  npm-audit:
    name: npm audit · Node dep vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run npm audit · gate critical
        run: |
          cd frontend
          # Gate en CRITICAL (bloquea merge). Los advisories HIGH actuales son de
          # Next.js (14.x) y su único fix es `next@16` (cambio MAYOR que rompería
          # el App Router) → NO se aplica en piloto. Quedan registrados como
          # Future-1.F.frontend.next16-upgrade (revisar tras piloto). CRITICAL sí
          # corta. --production = solo dependencias de runtime.
          npm audit \
            --audit-level=critical \
            --production \
            --json \
            > npm-audit-report.json \
            || (cat npm-audit-report.json && exit 1)

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.json
          retention-days: 30
