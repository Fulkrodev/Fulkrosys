name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        # Pin a la versión validada en local (mismas reglas/comportamiento).
        run: pip install ruff==0.15.13
      - name: Lint
        run: ruff check backend/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install mypy sqlalchemy pydantic fastapi
      - name: Type check
        run: mypy backend/app/ --ignore-missing-imports
        continue-on-error: true

  # W9-2 (audit-roundup 2026-06-16 · §5): gate de typecheck del FRONTEND. Antes
  # sólo `next build` (job playwright, on-demand) ejercía TS → no había gate
  # rápido en cada PR. `npm run typecheck` == `tsc --noEmit` (baseline 0 errores).
  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: cd frontend && npm ci
      - name: Type check (tsc --noEmit)
        run: cd frontend && npm run typecheck

  test:
    # 2026-06-09 · la suite completa necesita la BD ENS provisionada (roles +
    # alembic head + seed + fixture de corpus) — el gate REAL de tests es LOCAL
    # (5978 passed · `bash scripts/build_test_db.sh && pytest`). En CI corre
    # on-demand (workflow_dispatch) hasta cablear la provisión completa de BD
    # en el runner (Future-1.F.ci.full-db-provision).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: fulkro_test
          POSTGRES_USER: fulkro
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: cd backend && pip install -e .[dev]
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://fulkro:test@localhost:5432/fulkro_test
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: test
          APP_SECRET_KEY: test-secret-key-not-for-production
        run: pytest backend/tests/ -v --tb=short

  playwright:
    # FASE 9.0 Sub-bloque 0.D: wiring specs Playwright en CI.
    # 2026-06-09 · E2E pesado (frontend build + browsers + BD) · on-demand
    # (workflow_dispatch). El gate E2E se ejecuta local/pre-deploy.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, typecheck, test]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: fulkro_test
          POSTGRES_USER: fulkro
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      # Backend env (mismo patrón que job `test`)
      DATABASE_URL: postgresql+asyncpg://fulkro:test@localhost:5432/fulkro_test
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
      APP_SECRET_KEY: test-secret-key-not-for-production
      # Playwright config — frontend webServer autoarranca next start en :3100
      PLAYWRIGHT_PORT: '3100'
      PLAYWRIGHT_BACKEND_URL: http://localhost:8000
      # Frontend rewrites proxy /api/* al backend
      FULKRO_BACKEND_URL: http://localhost:8000
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && pip install -e .[dev]

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Build frontend
        # Playwright webServer arranca `next start` (build-output requerido).
        run: cd frontend && npm run build

      - name: Start backend (uvicorn background)
        # globalSetup en frontend/tests/e2e/_helpers/global-setup.ts hace
        # POST /api/v1/_dev/create-test-client → backend debe estar arriba
        # antes de Playwright. _dev router gated por is_production: APP_ENV=test OK.
        # TODO 0.D verify on first run: alembic migrations puede ser necesario aquí
        # si la BD test arranca vacía y los tests asumen schema. El job `test`
        # también ejecuta sobre BD vacía vía pytest fixtures, así que asumimos
        # que conftest.py crea schema. Si falla en primer run, añadir paso
        # `alembic upgrade head` aquí antes del start backend.
        run: |
          cd /home/runner/work/fulkro/fulkro
          uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 \
            > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/health > /dev/null 2>&1; then
              echo "Backend up after ${i}s"
              curl -s http://localhost:8000/api/v1/health
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not become healthy in 60s. Logs:"
          cat /tmp/backend.log || true
          exit 1

      - name: Run Playwright tests (chromium)
        # Playwright webServer arranca `npx next start -p 3100` automáticamente
        # (reuseExistingServer:false en CI). Solo browsers chromium.
        # firefox + webkit diferidos a futuro (saving CI minutes).
        run: cd frontend && npx playwright test --project=chromium

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill $(cat /tmp/backend.pid) 2>/dev/null || true
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: /tmp/backend.log
          retention-days: 7
