name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        # Pin a la versión validada en local (mismas reglas/comportamiento).
        run: pip install ruff==0.15.13
      - name: Lint
        run: ruff check backend/

  # ─────────────────────────────────────────────────────────────────────────
  # typecheck · 2026-09-10 · REESCRITO. Antes este job era doblemente falso:
  #
  #   1. `mypy backend/app/ --ignore-missing-imports` desde la RAÍZ del repo
  #      abortaba con «Source file found twice under different module names»
  #      (el mismo fichero es alcanzable como `app.*` y como `backend.app.*`),
  #      salía con código 2 y comprobaba CERO ficheros.
  #   2. `continue-on-error: true` pintaba ese aborto de verde.
  #
  # Arreglo: se invoca mypy DESDE `backend/` (así `app` es la única raíz de
  # paquete posible, y el choque de nombres desaparece) y SIN máscara.
  #
  # Decisión sobre el alcance, y por qué. Las dos opciones eran (a) quitar
  # `continue-on-error` de golpe sobre todo `backend/app/`, o (b) acotar a una
  # lista de módulos ya limpios que sólo pueda crecer. Se elige (b) porque (a)
  # es inviable HOY, y está medido (2026-09-10, mypy 2.1.0):
  #
  #     $ cd backend && mypy app/ --ignore-missing-imports --no-incremental
  #     515 errores en 212 ficheros (de 1.056 ficheros .py bajo backend/app/)
  #
  # Un job que nace rojo con 515 errores se desactiva a la semana, y volvemos a
  # la máscara. La lista vive en `.github/mypy-clean-modules.txt` (fuera del
  # YAML, como fichero de configuración editable) con la regla escrita dentro:
  # SÓLO PUEDE CRECER. Quitar una ruta para poner el CI en verde es reintroducir
  # la máscara, no corregir nada.
  # ─────────────────────────────────────────────────────────────────────────
  typecheck:
    name: mypy · módulos limpios (sin máscara)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          # Se instalan las dependencias REALES del proyecto, no un puñado suelto.
          # Con `--ignore-missing-imports` y las libs ausentes, todo lo que venga de
          # ellas pasa a ser `Any`, y `warn_return_any = true`
          # (backend/pyproject.toml) convierte eso en errores `no-any-return`
          # fantasma: el gate fallaría por lo que NO está instalado, no por el
          # código. La lista de módulos limpios se midió con el entorno completo.
          sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2-dev pkg-config
          pip install -e "backend[dev]"
          # Pin a la versión con la que se midió la lista (el extra `dev` declara
          # `mypy>=1.11`, sin techo: una versión nueva puede añadir comprobaciones
          # y volver roja una lista que estaba limpia, sin que nadie haya tocado
          # el código). Subir el pin es un cambio deliberado, no un accidente.
          pip install 'mypy==2.1.0'
      - name: Type check (mypy · lista de módulos limpios)
        working-directory: backend
        run: |
          set -euo pipefail
          mapfile -t MODULOS < <(grep -vE '^\s*(#|$)' ../.github/mypy-clean-modules.txt)
          echo "Módulos comprobados (${#MODULOS[@]} rutas):"
          printf '  %s\n' "${MODULOS[@]}"
          python -m mypy --ignore-missing-imports --follow-imports=silent "${MODULOS[@]}"
      - name: Publicar cobertura de typecheck en el resumen
        if: always()
        run: |
          set -euo pipefail
          TOTAL=$(find backend/app -name '*.py' | wc -l)
          CUBIERTOS=$(cd backend && python - <<'PY'
          import pathlib
          rutas = [l.strip() for l in open('../.github/mypy-clean-modules.txt')
                   if l.strip() and not l.lstrip().startswith('#')]
          print(sum(len(list(pathlib.Path(r).rglob('*.py'))) for r in rutas))
          PY
          )
          PCT=$(python -c "print(f'{100*$CUBIERTOS/$TOTAL:.1f}')")
          {
            echo "## mypy · cobertura declarada"
            echo
            echo "| ficheros \`.py\` bajo \`backend/app/\` | comprobados por este gate | % |"
            echo "|---:|---:|---:|"
            echo "| $TOTAL | $CUBIERTOS | ${PCT}% |"
            echo
            echo "El resto NO se comprueba todavía: \`mypy app/\` completo da 515 errores"
            echo "en 212 ficheros (medido 2026-09-10). La lista de módulos limpios está en"
            echo "\`.github/mypy-clean-modules.txt\` y **sólo puede crecer**."
          } >> "$GITHUB_STEP_SUMMARY"

  # W9-2 (audit-roundup 2026-06-16 · §5): gate de typecheck del FRONTEND. Antes
  # sólo `next build` (job playwright, on-demand) ejercía TS → no había gate
  # rápido en cada PR. `npm run typecheck` == `tsc --noEmit` (baseline 0 errores).
  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: cd frontend && npm ci
      - name: Type check (tsc --noEmit)
        run: cd frontend && npm run typecheck

  # ─────────────────────────────────────────────────────────────────────────
  # test · 2026-09-10 · ACTIVADO. Antes llevaba `if: github.event_name ==
  # 'workflow_dispatch'`, así que NUNCA llegó a ejecutarse:
  #
  #     $ gh run list --workflow=ci.yml --limit 200 --json event \
  #         --jq '[.[].event] | group_by(.) | map({evento: .[0], n: length})'
  #     [{"evento":"push","n":121}]     # 121 runs, ni uno por workflow_dispatch
  #
  # Quitar ese `if` NO bastaba: el job sólo levantaba un pgvector pelado
  # con la base VACÍA, sin extensiones, sin roles, sin `alembic upgrade head`, y
  # además apuntaba `DATABASE_URL` al superusuario `fulkro` (que ignora RLS,
  # justo lo contrario de lo que los tests de aislamiento pretenden verificar).
  #
  # La provisión de abajo NO es nueva: es la receta de
  # `.github/workflows/admin-polish-empirical.yml:106-136`, que lleva decenas de
  # runs verdes. Sus tres piezas y por qué cada una:
  #   · extensiones uuid-ossp + pgcrypto + vector, y NO `age` ni `pgaudit`: la
  #     imagen pgvector/pgvector:pg16 no las trae, así que ejecutar
  #     `infra/docker/init-extensions.sql` entero (que las crea bajo
  #     ON_ERROR_STOP=1) reventaría el paso.
  #   · init-functions.sql + init-roles.sql: crean los helpers de RLS y los roles
  #     fulkro_app (NOSUPERUSER, RLS aplicado) y fulkro_migrate.
  #   · alembic upgrade head como fulkro_migrate + GRANTs a fulkro_app: los
  #     objetos los crea el rol de migración; sin los GRANT posteriores el rol de
  #     runtime no ve las tablas nuevas.
  # La base se llama `fulkro` porque init-roles.sql cablea
  # `GRANT CONNECT ON DATABASE fulkro`.
  #
  # QUÉ QUEDA FUERA, POR QUÉ, Y CON QUÉ MARCA SE DELIMITA
  # ----------------------------------------------------
  # Se ejecuta `-m "not requires_db"`. La marca `requires_db` ya existe
  # (backend/pyproject.toml:143) y `backend/tests/conftest.py` la aplica sola a
  # todo test que pida un fixture de base de datos. Reparto medido el 2026-09-10:
  #
  #     $ pytest backend/tests/ --collect-only -q                     -> 6470
  #     $ pytest backend/tests/ --collect-only -q -m "not requires_db" -> 3176
  #     $ pytest backend/tests/ --collect-only -q -m "requires_db"     -> 3294
  #
  # Este reparto se mueve cuando se añaden tests, y por eso el resumen del job
  # lo cuenta EN CADA RUN en vez de repetir estas cifras.
  #
  # Los 3.294 `requires_db` quedan fuera, y el motivo NO es el runner (RAM, CPU
  # ni disco): necesitan la base SEMBRADA (73 medidas ENS, 57 amenazas, 98
  # salvaguardas, catálogos de plantillas y tarifas...) más el fixture de corpus
  # `backend/tests/fixtures/corpus_seed.sql.gz`. Contra esta misma provisión SIN
  # sembrar, la marca `requires_db` se cae a cientos de fallos por catálogos
  # vacíos, no por el código (medido el 2026-09-10: 235 fallos en el 74% de la
  # selección, antes de cortar la ejecución por tiempo).
  #
  # Lo que sí está medido, y es el siguiente paso natural de este job: sembrar en
  # esta imagen YA FUNCIONA. `backend/scripts/seed_all_fulkro.py` relaja por sí
  # solo las extensiones que la imagen no ofrece (`age`, `pgaudit`), así que
  # sobre este mismo postgres pgvector:pg16:
  #
  #     $ python backend/scripts/seed_all_fulkro.py --skip-corpus --skip-age-kg
  #     "elapsed_seconds": 1.37 · "ok": 25 · "skip": 2 · "fail": 0
  #     $ gzip -dc backend/tests/fixtures/corpus_seed.sql.gz | psql ...
  #     chunks=1031 · refuerzos=133
  #
  # Y sobre esa base sembrada, una MUESTRA acotada de `requires_db` sale limpia
  # (misma provisión, 2026-09-10):
  #
  #     $ pytest backend/tests/{api,auth,core,models,security,audit_fixes} \
  #         backend/tests/test_rls_multitenancy.py -m requires_db -q
  #     289 passed, 297 deselected in 108.44s
  #
  # Lo que NO está medido, y por eso NO se activa aquí, es que pasen los 3.294
  # enteros: la ejecución local supera la hora y no se llegó a terminar.
  # Ampliar este job son dos pasos más (seed + carga del fixture de corpus) y
  # cambiar la selección, pero SÓLO después de una ejecución completa en verde
  # que lo respalde. Ampliarlo a ciegas es cómo se acaba otra vez con un
  # `continue-on-error`.
  #
  # Mientras tanto: el subconjunto que corre es REAL y su número se publica en
  # el resumen del job, en vez de presumir de una suite que no se ejecuta.
  #
  # Ojo a un detalle que cuesta media hora descubrir: `conftest.py:73-78`
  # reescribe cualquier URL acabada en `/fulkro` a `/fulkro_test`. Por eso el job
  # exporta `FULKRO_TEST_DB_NAME: fulkro`, para que la reescritura sea la
  # identidad y apunte a la base que este job acaba de provisionar.
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: pytest · subconjunto sin BD sembrada
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: fulkro
          POSTGRES_USER: fulkro
          POSTGRES_PASSWORD: fulkro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fulkro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # runtime = fulkro_app (NOSUPERUSER · RLS aplicado), NO el superusuario:
      # los tests de aislamiento multi-tenant sólo prueban algo bajo este rol.
      DATABASE_URL: postgresql+asyncpg://fulkro_app:fulkro_app_dev_password@localhost:5432/fulkro
      DATABASE_MIGRATE_URL: postgresql://fulkro_migrate:fulkro_migrate_dev_password@localhost:5432/fulkro
      FULKRO_TEST_DB_NAME: fulkro
      APP_ENV: dev
      # Sin esto fallan 8 tests de cifrado (m08 SSH credentials, m16 connectors)
      # con «app_secret_key too short or not configured». Estaba en la versión
      # anterior de este job y se conserva.
      APP_SECRET_KEY: test-secret-key-not-for-production
      # `backend/` no es un paquete (no tiene __init__.py) y los tests importan
      # `backend.app` desde la raíz del repo — lo dice backend/pyproject.toml:248.
      # `python -m pytest` ya mete el cwd en sys.path, pero dejarlo explícito
      # evita que un cambio de directorio de trabajo rompa la colección entera.
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Claves Ed25519 efímeras (sin secretos de repo)
        # Mismo patrón que admin-polish-empirical.yml. No es cosmético: sin
        # FULKRO_AUTH_PRIVATE_KEY, `get_master_fernet()` no tiene semilla y los
        # tests de cifrado en reposo (backend/tests/core/encryption/,
        # m08 ssh_credentials, m16 connectors) revientan con «Encryption master
        # key unavailable». Peor aún, hoy pasan o fallan según el ORDEN de la
        # suite, porque `get_master_fernet` está bajo `lru_cache` y algún test
        # anterior puede haber cebado la caché: medido el 2026-09-10, la misma
        # selección dio 3 fallos en una ejecución y 11 en otra. Fijar la clave
        # aquí elimina esa dependencia del orden.
        run: |
          set -euo pipefail
          openssl genpkey -algorithm ed25519 -out /tmp/auth_priv.pem
          openssl pkey -in /tmp/auth_priv.pem -pubout -out /tmp/auth_pub.pem
          openssl genpkey -algorithm ed25519 -out /tmp/ml_priv.pem
          openssl genpkey -algorithm ed25519 -out /tmp/backup_priv.pem
          # Enmascarar antes de exportarlas: al escribirlas en $GITHUB_ENV, el
          # runner las imprime enteras en la cabecera de cada paso posterior, y
          # este repositorio es publico. Son claves efimeras de un solo uso, asi
          # que el riesgo real es nulo, pero un PEM privado a la vista en un log
          # publico se lee mal y no cuesta nada evitarlo.
          # Solo el cuerpo en base64: enmascarar tambien las lineas -----BEGIN/END-----
          # convertiria en *** una cadena comunisima y llenaria el log de ruido.
          grep -hvE '^-----|^$' /tmp/auth_priv.pem /tmp/ml_priv.pem /tmp/backup_priv.pem \
            | while IFS= read -r _linea; do echo "::add-mask::${_linea}"; done
          {
            echo 'FULKRO_AUTH_PRIVATE_KEY<<__PEM__';   cat /tmp/auth_priv.pem;   echo '__PEM__'
            echo 'FULKRO_AUTH_PUBLIC_KEY<<__PEM__';    cat /tmp/auth_pub.pem;    echo '__PEM__'
            echo 'FULKRO_ML_PRIVATE_KEY<<__PEM__';     cat /tmp/ml_priv.pem;     echo '__PEM__'
            echo 'FULKRO_BACKUP_SIGNING_KEY<<__PEM__'; cat /tmp/backup_priv.pem; echo '__PEM__'
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          # pycairo (dep transitiva vía svglib) compila desde fuente.
          # libreoffice-writer: m06_document_factory convierte DOCX a PDF llamando
          # al binario `libreoffice`. Sin él, backend/tests/motors/m06_document_factory/
          # test_rendering.py falla con PDFConversionError. Es una dependencia de
          # SISTEMA que el proyecto no declaraba en ninguna parte: se descubrió el
          # 2026-09-10, la primera vez que el job de tests llegó a ejecutarse.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2-dev pkg-config libreoffice-writer
          libreoffice --version
          pip install -e "backend[dev]"
          pip install psycopg2-binary

      - name: Provision DB (extensiones subset + funciones + roles)
        run: |
          set -euo pipefail
          export PGPASSWORD=fulkro
          psql -h localhost -U fulkro -d fulkro -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";' \
            -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto;' \
            -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          psql -h localhost -U fulkro -d fulkro -v ON_ERROR_STOP=1 -f infra/docker/init-functions.sql
          psql -h localhost -U fulkro -d fulkro -v ON_ERROR_STOP=1 -f infra/docker/init-roles.sql

      - name: Migrations (alembic upgrade head como fulkro_migrate)
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Grants runtime (fulkro_app sobre las tablas de las migraciones)
        run: |
          set -euo pipefail
          export PGPASSWORD=fulkro
          psql -h localhost -U fulkro -d fulkro -v ON_ERROR_STOP=1 -c \
            "GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA public TO fulkro_app, fulkro_app_bypassrls;
             GRANT USAGE,SELECT ON ALL SEQUENCES IN SCHEMA public TO fulkro_app, fulkro_app_bypassrls;
             GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO fulkro_app, fulkro_app_bypassrls;"

      - name: Directorio de salida `progress/`
        # `backend/scripts/legal_audit_77_templates.py` escribe
        # progress/legal_audit_autocheck.json y el directorio está en
        # .gitignore, así que en un clon limpio no existe y
        # test_legal_audit_score_100 muere con FileNotFoundError.
        run: mkdir -p progress

      # Los TESTS van primero. Antes el conteo iba delante y, al ser un paso
      # normal, si fallaba dejaba `Run tests` en skipped: un contador tumbaba el
      # gate entero sin ejecutar ni un test. Paso en CI el 2026-09-10.
      - name: Run tests (-m "not requires_db")
        run: |
          # Sin --timeout: backend/pyproject.toml ya fija timeout=300 por test.
          python -m pytest backend/tests/ -m "not requires_db" \
            -q --tb=short --junitxml=/tmp/junit.xml

      - name: Contar la suite completa (denominador del resumen)
        # Es informativo: nunca debe tumbar el job. Si no se puede contar, se dice.
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          python -m pytest backend/tests/ --collect-only -q > /tmp/collect.txt 2>&1 || true
          # La linea del recuento NO es necesariamente la ultima: pytest puede
          # imprimir despues el resumen de warnings. Se busca en toda la salida.
          TOTAL="$(grep -oE '^[0-9]+ tests? collected' /tmp/collect.txt \
                   | grep -oE '^[0-9]+' | tail -1 || true)"
          if [ -z "${TOTAL}" ]; then
            echo "AVISO: no se pudo contar la suite completa. Ultimas lineas:"
            tail -20 /tmp/collect.txt
          else
            echo "${TOTAL}" > /tmp/total_tests.txt
            echo "suite completa: ${TOTAL} tests"
          fi

      - name: Publicar cuántos tests corren de los que hay
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path

          # El denominador es informativo: si no se pudo contar, el resumen se
          # publica igual diciendo que no se midio, en vez de reventar.
          f_total = Path("/tmp/total_tests.txt")
          total = int(f_total.read_text().strip()) if f_total.exists() else None
          f_junit = Path("/tmp/junit.xml")
          if not f_junit.exists():
              print("## pytest en CI")
              print()
              print("No hay `junit.xml`: el paso de tests no llego a producir informe.")
              raise SystemExit(0)
          raiz = ET.parse("/tmp/junit.xml").getroot()
          suite = raiz if raiz.tag == "testsuite" else raiz[0]
          a = suite.attrib
          recogidos = int(a["tests"])
          saltados = int(a.get("skipped", 0))
          fallos = int(a.get("failures", 0)) + int(a.get("errors", 0))
          ejecutados = recogidos - saltados

          print("## pytest en CI · qué parte de la suite corre de verdad")
          print()
          print("| concepto | tests |")
          print("|---|---:|")
          print(f"| suite completa (`pytest --collect-only`) | {total if total else 'no medido'} |")
          print(f"| seleccionados por `-m \"not requires_db\"` | {recogidos} |")
          print(f"| **ejecutados** (seleccionados menos saltados) | **{ejecutados}** |")
          print(f"| saltados | {saltados} |")
          print(f"| fallidos + errores | {fallos} |")
          print()
          if total:
              print(f"**Cobertura real de este job: {ejecutados}/{total} "
                    f"= {100 * ejecutados / total:.1f}% de la suite.**")
          else:
              print(f"**Ejecutados {ejecutados} tests.** El denominador no se pudo "
                    f"medir en esta ejecucion (ver el paso de conteo)." )
          print()
          print(f"Los {total - recogidos} restantes llevan la marca `requires_db`: "
                "necesitan la base SEMBRADA (catálogos ENS + fixture de corpus), "
                "que este job todavía no monta. El comentario del job `test` en "
                "`.github/workflows/ci.yml` explica qué falta exactamente y qué "
                "hay ya medido para cerrarlo.")
          PY

      - name: Subir junit.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-backend
          path: /tmp/junit.xml
          retention-days: 7

  playwright:
    # FASE 9.0 Sub-bloque 0.D: wiring specs Playwright en CI.
    # 2026-09-10 · SIGUE on-demand (workflow_dispatch), y esta vez con el motivo
    # medido: los E2E necesitan la base SEMBRADA igual que los `requires_db`
    # (mismo bloqueo de `seed_all_fulkro.py:100`), más build de frontend y
    # navegadores. El gate de accesibilidad que SÍ corre solo es
    # `admin-polish-empirical.yml`, que provisiona su propia base y usa
    # `/_dev/create-test-client` en vez del seed.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, typecheck, test]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: fulkro_test
          POSTGRES_USER: fulkro
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      # Backend env (mismo patrón que job `test`)
      DATABASE_URL: postgresql+asyncpg://fulkro:test@localhost:5432/fulkro_test
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
      APP_SECRET_KEY: test-secret-key-not-for-production
      # Playwright config — frontend webServer autoarranca next start en :3100
      PLAYWRIGHT_PORT: '3100'
      PLAYWRIGHT_BACKEND_URL: http://localhost:8000
      # Frontend rewrites proxy /api/* al backend
      FULKRO_BACKEND_URL: http://localhost:8000
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && pip install -e .[dev]

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Build frontend
        # Playwright webServer arranca `next start` (build-output requerido).
        run: cd frontend && npm run build

      - name: Start backend (uvicorn background)
        # globalSetup en frontend/tests/e2e/_helpers/global-setup.ts hace
        # POST /api/v1/_dev/create-test-client → backend debe estar arriba
        # antes de Playwright. _dev router gated por is_production: APP_ENV=test OK.
        run: |
          python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 \
            > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/health > /dev/null 2>&1; then
              echo "Backend up after ${i}s"
              curl -s http://localhost:8000/api/v1/health
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not become healthy in 60s. Logs:"
          cat /tmp/backend.log || true
          exit 1

      - name: Run Playwright tests (chromium)
        # Playwright webServer arranca `npx next start -p 3100` automáticamente
        # (reuseExistingServer:false en CI). Solo browsers chromium.
        run: cd frontend && npx playwright test --project=chromium

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill "$(cat /tmp/backend.pid)" 2>/dev/null || true
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: /tmp/backend.log
          retention-days: 7
