name: Admin + Cliente + Auditor Polish Empirical

# Sub-atom Sesión 3B-2B.3 · regression-proof permanent EXPANDED 80 pages.
# Ejecutable 7 (2026-05-27) · consolidate Path A · adds cliente + auditor jobs.
# 2026-06-09 · REESCRITO greenfield (el yml original nunca corrió en GitHub):
#   - SIN secretos de repo: claves Ed25519 EFÍMERAS por run (openssl → GITHUB_ENV).
#   - deps backend desde backend/pyproject.toml (pip install -e ".[dev]" + psycopg2).
#   - BD = postgres service pgvector:pg16, DB **fulkro** (init-roles.sql hardcodea
#     GRANT CONNECT ON DATABASE fulkro) · extensiones subset CI (uuid-ossp +
#     pgcrypto + vector · SIN age/pgaudit que la imagen no trae) → init-functions
#     → init-roles → alembic upgrade head (DATABASE_MIGRATE_URL · fulkro_migrate)
#     → re-GRANT runtime.
#   - uvicorn backend.app.main:app desde repo root · health /api/v1/health.
#   - runtime app = fulkro_app (asyncpg) · paridad con dev/prod (RLS + SET ROLE).
#   - SIN seed: el globalSetup de Playwright provisiona vía /_dev/create-test-client
#     + /_dev/seed-rich-demo-project (proyecto fijo 00000000-...-000000000001).
#   - POLISH_TEST_PROJECT_ID apunta al proyecto seed → cobertura REAL project-scoped
#     (sin él, los specs project-scoped redirigen al selector y pasan en blando).
#   - SIN --reporter CLI (pisaría el outputFolder polish-report del config).
#
# Gate: axe critical/serious = 0 en cada página + 4 criterios explícitos por spec.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/admin-polish-empirical.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/admin-polish-empirical.yml"

env:
  DATABASE_URL: postgresql+asyncpg://fulkro_app:fulkro_app_dev_password@localhost:5432/fulkro
  DATABASE_MIGRATE_URL: postgresql://fulkro_migrate:fulkro_migrate_dev_password@localhost:5432/fulkro
  APP_ENV: dev
  FULKRO_BACKEND_URL: http://localhost:8000
  PLAYWRIGHT_PORT: "3100"
  PLAYWRIGHT_SKIP_WEB_SERVER: "1"
  PLAYWRIGHT_BACKEND_URL: http://localhost:8000
  POLISH_TEST_PROJECT_ID: 00000000-0000-0000-0000-000000000001

jobs:
  polish-empirical:
    name: Admin Polish 80 pages (PROBE + P1 + P2 + P3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fulkro
          POSTGRES_PASSWORD: fulkro
          POSTGRES_DB: fulkro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fulkro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Generate ephemeral Ed25519 keys (no repo secrets)
        run: |
          set -euo pipefail
          openssl genpkey -algorithm ed25519 -out /tmp/auth_priv.pem
          openssl pkey -in /tmp/auth_priv.pem -pubout -out /tmp/auth_pub.pem
          openssl genpkey -algorithm ed25519 -out /tmp/ml_priv.pem
          openssl genpkey -algorithm ed25519 -out /tmp/backup_priv.pem
          {
            echo 'FULKRO_AUTH_PRIVATE_KEY<<__PEM__';   cat /tmp/auth_priv.pem;   echo '__PEM__'
            echo 'FULKRO_AUTH_PUBLIC_KEY<<__PEM__';    cat /tmp/auth_pub.pem;    echo '__PEM__'
            echo 'FULKRO_ML_PRIVATE_KEY<<__PEM__';     cat /tmp/ml_priv.pem;     echo '__PEM__'
            echo 'FULKRO_BACKUP_SIGNING_KEY<<__PEM__'; cat /tmp/backup_priv.pem; echo '__PEM__'
          } >> "$GITHUB_ENV"

      - name: Provision DB (extensions subset + functions + roles)
        run: |
          set -euo pipefail
          export PGPASSWORD=fulkro
          psql -h localhost -U fulkro -d fulkro -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";' \
            -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto;' \
            -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          psql -h localhost -U fulkro -d fulkro -v ON_ERROR_STOP=1 -f infra/docker/init-functions.sql
          psql -h localhost -U fulkro -d fulkro -v ON_ERROR_STOP=1 -f infra/docker/init-roles.sql

      - name: Install backend deps
        run: |
          # pycairo (dep transitiva) compila desde fuente → necesita cairo dev libs
          sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2-dev pkg-config
          pip install -e "backend[dev]"
          pip install psycopg2-binary

      - name: Migrations (alembic upgrade head as fulkro_migrate)
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Grants runtime (fulkro_app sobre tablas de migraciones)
        run: |
          set -euo pipefail
          export PGPASSWORD=fulkro
          psql -h localhost -U fulkro -d fulkro -v ON_ERROR_STOP=1 -c \
            "GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA public TO fulkro_app, fulkro_app_bypassrls;
             GRANT USAGE,SELECT ON ALL SEQUENCES IN SCHEMA public TO fulkro_app, fulkro_app_bypassrls;
             GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO fulkro_app, fulkro_app_bypassrls;"

      - name: Start backend (uvicorn desde repo root)
        run: |
          python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 \
            > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/api/v1/health > /dev/null 2>&1 && { echo "Backend ready (${i}s)"; exit 0; }
            sleep 1
          done
          echo "Backend no levantó · log:"; cat /tmp/backend.log; exit 1

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend (prod)
        working-directory: frontend
        run: npm run build

      - name: Start frontend (next start :3100)
        working-directory: frontend
        run: |
          npx next start -p 3100 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 45); do
            curl -fsS -o /dev/null http://localhost:3100 2>/dev/null && { echo "Frontend ready (${i}s)"; exit 0; }
            sleep 1
          done
          echo "Frontend no levantó · log:"; cat /tmp/frontend.log; exit 1

      - name: Run admin polish (PROBE + P1 + P2 + P3 · 75 specs)
        working-directory: frontend
        run: |
          npx playwright test --config=playwright.polish.config.ts \
            tests/polish/probe/ tests/polish/p1/ tests/polish/p2/ tests/polish/p3/

      - name: Upload polish HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polish-report-admin
          path: frontend/polish-report/
          retention-days: 14

      - name: Upload test results (traces · screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: polish-test-results-admin
          path: frontend/polish-test-results/
          retention-days: 14

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log-admin
          path: /tmp/backend.log
          retention-days: 7

